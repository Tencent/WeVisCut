<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "type": "string", "label": "小标签", "default": "核心概念"}, {"id": "term", "type": "string", "label": "概念名", "default": "知识蒸馏"}, {"id": "definition", "type": "string", "label": "定义正文", "default": "把大模型学到的知识迁移到小模型上，让小模型在更低成本下逼近大模型的表现"}, {"id": "keyword1", "type": "string", "label": "关键词1", "default": "教师模型"}, {"id": "keyword2", "type": "string", "label": "关键词2", "default": "软标签"}, {"id": "keyword3", "type": "string", "label": "关键词3", "default": "模型压缩"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (minimal_academic) ===== */
      :root {
        --bg: #fbfbf9;
        --bg-2: #f3f3ee;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #1a2238;
        --ink-2: #454f6b;
        --ink-3: #8b93a7;
        --accent: #2f5d8a;
        --accent-2: #b08328;
        --danger: #9b2c2c;
        --success: #2f7a55;
        --line: rgba(26,34,56,.10);
        --line-strong: rgba(26,34,56,.24);
        --font-display: "Noto Serif SC", Georgia, serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 700;
        --weight-body: 400;
        --radius-card: 4px;
        --radius-pill: 999px;
        --shadow-soft: none;
        --shadow-glow: none;
        --grid-color: rgba(26,34,56,.05);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 22px;
        --stage-blur: 0px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        border-bottom: 1px solid var(--line);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (definition_card_split) ===== */
      [data-hf="structure-dom"] {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 80px 100px;
        gap: 64px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .def-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
        border-right: 2px solid var(--line);
        padding-right: 56px;
      }

      [data-hf="structure-dom"] .def-eyebrow {
        display: inline-flex;
        align-items: center;
        padding: 8px 26px;
        border-radius: var(--radius-pill);
        background: var(--surface);
        border: 1px solid var(--line);
        font-family: var(--font-caption);
        font-weight: var(--weight-body);
        font-size: 22px;
        color: var(--ink-2);
        letter-spacing: 0.1em;
      }

      [data-hf="structure-dom"] .def-term {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 76px;
        line-height: 1.15;
        color: var(--ink-1);
        max-width: 560px;
      }

      [data-hf="structure-dom"] .def-term .accent {
        color: var(--accent);
      }

      [data-hf="structure-dom"] .def-line {
        width: 88px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      [data-hf="structure-dom"] .def-right {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 28px;
      }

      [data-hf="structure-dom"] .def-body {
        font-family: var(--font-body);
        font-weight: var(--weight-body);
        font-size: 32px;
        line-height: 1.6;
        color: var(--ink-2);
        max-width: 760px;
      }

      [data-hf="structure-dom"] .def-keywords {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      [data-hf="structure-dom"] .def-pill {
        display: inline-flex;
        align-items: center;
        padding: 10px 28px;
        border-radius: var(--radius-pill);
        background: var(--surface-2);
        border: 1px solid var(--line-strong);
        font-family: var(--font-caption);
        font-weight: var(--weight-body);
        font-size: 22px;
        color: var(--ink-1);
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <div class="def-left">
              <div class="def-eyebrow" data-anim-role="eyebrow" data-slot="eyebrow">概念</div>
              <h1 class="def-term" data-anim-role="title" data-slot="term">向量数据库</h1>
              <div class="def-line" data-anim-role="accent-line"></div>
            </div>
            <div class="def-right">
              <p class="def-body" data-anim-role="subtitle" data-slot="definition">一种以高维向量为索引单元、按相似度而非精确匹配检索数据的存储系统</p>
              <div class="def-keywords">
                <span class="def-pill" data-anim-role="list-item" data-slot="keyword1">相似检索</span>
                <span class="def-pill" data-anim-role="list-item" data-slot="keyword2">嵌入</span>
                <span class="def-pill" data-anim-role="list-item" data-slot="keyword3">近邻搜索</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.35" data-duration="1.2" data-track-index="102" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
      <audio id="sfx-1" data-start="0.3" data-duration="0.6" data-track-index="103" src="sfx/pop.mp3" data-volume="0.3"></audio>
      <audio id="sfx-2" data-start="1.2" data-duration="0.3" data-track-index="104" src="sfx/tick.mp3" data-volume="0.25"></audio>
    </div>
    <!-- ===== Layer 2: motion (slide_in_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["slide_in_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 24, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.12);
        }
        if ($("title").length) {
          tl.from($("title"), { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.50);
        }
        if ($("stat").length) {
          tl.from($("stat"), { x: -40, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.40);
        }
        if ($("unit").length) {
          tl.from($("unit"), { x: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.60);
        }
        if ($("card").length) {
          var cards = $("card");
          for (var i = 0; i < cards.length; i++) {
            var xOff = (i % 2 === 0) ? -60 : 60;
            tl.from(cards[i], { x: xOff, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.35 + i * 0.12);
          }
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 14, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { x: 40, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.30);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.75);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: -16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.80);
        }
        if ($("cta").length) {
          tl.from($("cta"), { y: 20, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.85);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.55);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 5.5, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["slide_in_hold"]) {
              window.__hf_motions["slide_in_hold"](tl, { gsap: gsap, root: root, duration: 5.5, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
