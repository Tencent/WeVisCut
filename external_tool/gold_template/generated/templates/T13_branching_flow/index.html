<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "标题", "default": "一个底座，三种能力"}, {"id": "root_label", "type": "string", "label": "主干名称", "default": "统一大模型"}, {"id": "branches", "type": "string", "label": "分支节点", "default": "[{\"label\": \"文本理解\"}, {\"label\": \"图像识别\"}, {\"label\": \"语音交互\"}]"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (dark_tech) ===== */
      :root {
        --bg: #060d1a;
        --bg-2: #0a1525;
        --surface: rgba(20,38,60,.55);
        --surface-2: rgba(20,38,60,.82);
        --ink-1: #eef6fb;
        --ink-2: #b9d3e6;
        --ink-3: #7d96ad;
        --accent: #7fc7d9;
        --accent-2: #f5b14a;
        --danger: #ff7a7a;
        --success: #6ee7b7;
        --line: rgba(127,199,217,.18);
        --line-strong: rgba(127,199,217,.42);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 22px;
        --radius-pill: 999px;
        --shadow-soft: 0 12px 36px rgba(0,0,0,.45);
        --shadow-glow: 0 0 36px rgba(127,199,217,.35);
        --grid-color: rgba(127,199,217,.05);
        --stage-bg: rgba(10,21,37,.5);
        --radius-stage: 48px;
        --stage-blur: 10px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 60% at 30% 40%, rgba(127,199,217,.10) 0%, transparent 70%),
          radial-gradient(ellipse 50% 50% at 75% 65%, rgba(245,177,74,.06) 0%, transparent 60%),
          repeating-linear-gradient(0deg, transparent, transparent 79px, var(--grid-color) 79px, var(--grid-color) 80px),
          repeating-linear-gradient(90deg, transparent, transparent 79px, var(--grid-color) 79px, var(--grid-color) 80px),
          var(--bg);
        mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 50%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 50%, transparent 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (branching_flow) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 52px 80px 48px;
        gap: 20px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .bf-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 60px;
        line-height: 1.2;
        color: var(--ink-1);
        max-width: 1100px;
      }

      [data-hf="structure-dom"] .bf-area {
        flex: 1;
        position: relative;
        min-height: 0;
      }

      [data-hf="structure-dom"] .bf-edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      [data-hf="structure-dom"] .bf-edge {
        fill: none;
        stroke: var(--line-strong);
        stroke-width: 3;
        stroke-linecap: round;
      }

      [data-hf="structure-dom"] .bf-root {
        position: absolute;
        left: 4%;
        top: 50%;
        transform: translateY(-50%);
        max-width: 24%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 26px 30px;
        border-radius: var(--radius-card);
        background: var(--surface);
        border: 3px solid var(--accent);
        box-shadow: var(--shadow-glow);
      }

      [data-hf="structure-dom"] .bf-root-label {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 34px;
        line-height: 1.25;
        color: var(--ink-1);
      }

      [data-hf="structure-dom"] .bf-branch {
        position: absolute;
        left: 71%;
        transform: translateY(-50%);
        max-width: 25%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 26px;
        border-radius: var(--radius-pill);
        background: var(--surface);
        border: 2px solid var(--line-strong);
        box-shadow: var(--shadow-soft);
      }

      [data-hf="structure-dom"] .bf-dot {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: var(--radius-pill);
        background: var(--accent-2);
      }

      [data-hf="structure-dom"] .bf-branch-label {
        font-family: var(--font-body);
        font-weight: var(--weight-display);
        font-size: 26px;
        line-height: 1.25;
        color: var(--ink-1);
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7.0" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="bf-title" data-anim-role="title" data-slot="headline">一个底座，三种能力</h2>

            <div class="bf-area">
              <svg class="bf-edges" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path class="bf-edge" data-anim-role="edge" pathLength="1" vector-effect="non-scaling-stroke" d="M27 50 C 50 50, 48 12, 71 12"></path>
                <path class="bf-edge" data-anim-role="edge" pathLength="1" vector-effect="non-scaling-stroke" d="M27 50 C 50 50, 48 50, 71 50"></path>
                <path class="bf-edge" data-anim-role="edge" pathLength="1" vector-effect="non-scaling-stroke" d="M27 50 C 50 50, 48 88, 71 88"></path>
              </svg>

              <div class="bf-root" data-anim-role="node">
                <span class="bf-root-label" data-anim-role="node-label" data-slot="root_label">统一大模型</span>
              </div>

              <div class="bf-branch" data-anim-role="node" style="top: 12%">
                <span class="bf-dot" data-anim-role="marker"></span>
                <span class="bf-branch-label" data-anim-role="node-label">文本理解</span>
              </div>
              <div class="bf-branch" data-anim-role="node" style="top: 50%">
                <span class="bf-dot" data-anim-role="marker"></span>
                <span class="bf-branch-label" data-anim-role="node-label">图像识别</span>
              </div>
              <div class="bf-branch" data-anim-role="node" style="top: 88%">
                <span class="bf-dot" data-anim-role="marker"></span>
                <span class="bf-branch-label" data-anim-role="node-label">语音交互</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="0.6" data-track-index="102" src="sfx/pop.mp3" data-volume="0.3"></audio>
      <audio id="sfx-1" data-start="0.55" data-duration="1.2" data-track-index="103" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
    </div>
    <!-- ===== Structure self-animation (branching_flow) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };
        var SVGNS = "http://www.w3.org/2000/svg";

        var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
        var raw = V.branches || null;
        var branches = null;
        try { branches = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { branches = null; }

        var area = root.querySelector(".bf-area");
        var svg = root.querySelector(".bf-edges");
        function posFor(i, n) {
          if (n <= 1) return 50;
          return 12 + (88 - 12) * (i / (n - 1));
        }

        if (branches && Array.isArray(branches) && branches.length > 0 && area && svg) {
          var olds = area.querySelectorAll(".bf-branch");
          for (var o = 0; o < olds.length; o++) olds[o].parentNode.removeChild(olds[o]);
          svg.innerHTML = "";
          var n = branches.length;
          for (var i = 0; i < n; i++) {
            var p = posFor(i, n);
            var path = document.createElementNS(SVGNS, "path");
            path.setAttribute("class", "bf-edge");
            path.setAttribute("data-anim-role", "edge");
            path.setAttribute("pathLength", "1");
            path.setAttribute("vector-effect", "non-scaling-stroke");
            path.setAttribute("d", "M27 50 C 50 50, 48 " + p + ", 71 " + p);
            svg.appendChild(path);

            var node = document.createElement("div");
            node.className = "bf-branch";
            node.setAttribute("data-anim-role", "node");
            node.style.top = p + "%";
            var dot = document.createElement("span");
            dot.className = "bf-dot";
            dot.setAttribute("data-anim-role", "marker");
            var label = document.createElement("span");
            label.className = "bf-branch-label";
            label.setAttribute("data-anim-role", "node-label");
            label.textContent = branches[i].label != null ? branches[i].label : "";
            node.appendChild(dot);
            node.appendChild(label);
            area.appendChild(node);
          }
        }

        var rootNode = root.querySelector(".bf-root");
        if (rootNode) {
          tl.from(rootNode, { scale: 0.8, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.1);
        }

        var edges = root.querySelectorAll(".bf-edge");
        var branchNodes = root.querySelectorAll(".bf-branch");
        for (var b = 0; b < branchNodes.length; b++) {
          var t = 0.55 + b * 0.15;
          if (b < edges.length) {
            gsap.set(edges[b], { strokeDasharray: 1 });
            tl.from(edges[b], { strokeDashoffset: 1, duration: 0.5, ease: "power2.out" }, t);
          }
          var nodeLabel = branchNodes[b].querySelector(".bf-branch-label");
          var nodeDot = branchNodes[b].querySelector(".bf-dot");
          tl.from(branchNodes[b], { scale: 0.7, opacity: 0, duration: 0.4, ease: "back.out(1.6)" }, t + 0.32);
          if (nodeDot) tl.from(nodeDot, { scale: 0, opacity: 0, duration: 0.25, ease: "back.out(1.6)" }, t + 0.34);
          if (nodeLabel) tl.from(nodeLabel, { opacity: 0, x: 10, duration: 0.3, ease: "power2.out" }, t + 0.42);
        }

        function strip(role) { var els = $(role); for (var k = 0; k < els.length; k++) els[k].removeAttribute("data-anim-role"); }
        strip("node"); strip("edge"); strip("node-label"); strip("marker");
      };
    </script>
    <!-- ===== Layer 2: motion (scale_pop_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["scale_pop_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        }
        if ($("title").length) {
          tl.from($("title"), { scale: 0.82, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 24, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.62);
        }
        if ($("stat").length) {
          tl.from($("stat"), { scale: 0.75, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("unit").length) {
          tl.from($("unit"), { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.65);
        }
        if ($("card").length) {
          tl.from($("card"), { scale: 0.92, opacity: 0, duration: 0.55, ease: "back.out(1.3)", stagger: 0.15 }, 0.40);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.10 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { scale: 0.94, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.35);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.80);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.85);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.90);
        }
        if ($("cta").length) {
          tl.from($("cta"), { scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.0);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["scale_pop_hold"]) {
              window.__hf_motions["scale_pop_hold"](tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
