<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "type": "string", "label": "顶部标签", "default": "利弊分析"}, {"id": "headline", "type": "string", "label": "主标题", "default": "核能发电"}, {"id": "pro1", "type": "string", "label": "优势1", "default": "零碳排放运行"}, {"id": "pro2", "type": "string", "label": "优势2", "default": "能量密度极高"}, {"id": "pro3", "type": "string", "label": "优势3", "default": "不受天气影响"}, {"id": "con1", "type": "string", "label": "劣势1", "default": "核废料处理难"}, {"id": "con2", "type": "string", "label": "劣势2", "default": "建设成本极高"}, {"id": "con3", "type": "string", "label": "劣势3", "default": "事故风险虽小但后果严重"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (clean_saas) ===== */
      :root {
        --bg: #f7f9fc;
        --bg-2: #eef2f8;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --danger: #ef4444;
        --success: #10b981;
        --line: rgba(15,23,42,.08);
        --line-strong: rgba(15,23,42,.16);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 20px;
        --radius-pill: 999px;
        --shadow-soft: 0 16px 40px rgba(15,23,42,.10);
        --shadow-glow: 0 0 30px rgba(79,70,229,.18);
        --grid-color: rgba(15,23,42,.04);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 40px;
        --stage-blur: 8px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 45%, rgba(79,70,229,.06) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 80% 70%, rgba(14,165,233,.04) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (pros_cons_stack) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 64px 100px;
        gap: 28px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .eyebrow-pill {
        display: inline-flex;
        align-items: center;
        padding: 8px 28px;
        border-radius: var(--radius-pill);
        background: var(--surface);
        border: 1px solid var(--line);
        font-family: var(--font-caption);
        font-weight: var(--weight-body);
        font-size: 22px;
        color: var(--ink-2);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      [data-hf="structure-dom"] .pc-headline {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 56px;
        line-height: 1.15;
        color: var(--ink-1);
        text-align: center;
      }

      [data-hf="structure-dom"] .pc-stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 80%;
        flex: 1;
        min-height: 0;
        justify-content: center;
      }

      [data-hf="structure-dom"] .pc-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      [data-hf="structure-dom"] .pc-section-header {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 24px;
        padding-bottom: 8px;
      }

      [data-hf="structure-dom"] .pc-section-header.pro-header {
        color: var(--success);
      }

      [data-hf="structure-dom"] .pc-section-header.con-header {
        color: var(--danger);
      }

      [data-hf="structure-dom"] .pc-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-radius: var(--radius-card);
        font-family: var(--font-body);
        font-weight: var(--weight-body);
        font-size: 24px;
        color: var(--ink-1);
      }

      [data-hf="structure-dom"] .pc-item.pro-item {
        background: color-mix(in srgb, var(--success) 8%, transparent);
      }

      [data-hf="structure-dom"] .pc-item.con-item {
        background: color-mix(in srgb, var(--danger) 8%, transparent);
      }

      [data-hf="structure-dom"] .pc-icon {
        font-size: 20px;
        flex-shrink: 0;
      }

      [data-hf="structure-dom"] .pc-icon.pro-icon {
        color: var(--success);
      }

      [data-hf="structure-dom"] .pc-icon.con-icon {
        color: var(--danger);
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="6.5" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="6.5" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <div class="eyebrow-pill" data-anim-role="eyebrow" data-slot="eyebrow">利弊分析</div>
            <h1 class="pc-headline" data-anim-role="title" data-slot="headline">核能发电</h1>
            <div class="pc-stack">
              <div class="pc-section">
                <div class="pc-section-header pro-header">✓ 优势</div>
                <div class="pc-item pro-item" data-anim-role="list-item" data-slot="pro1">
                  <span class="pc-icon pro-icon">✓</span>
                  <span>零碳排放运行</span>
                </div>
                <div class="pc-item pro-item" data-anim-role="list-item" data-slot="pro2">
                  <span class="pc-icon pro-icon">✓</span>
                  <span>能量密度极高</span>
                </div>
                <div class="pc-item pro-item" data-anim-role="list-item" data-slot="pro3">
                  <span class="pc-icon pro-icon">✓</span>
                  <span>不受天气影响</span>
                </div>
              </div>
              <div class="pc-section">
                <div class="pc-section-header con-header">✗ 劣势</div>
                <div class="pc-item con-item" data-anim-role="list-item" data-slot="con1">
                  <span class="pc-icon con-icon">✗</span>
                  <span>核废料处理难</span>
                </div>
                <div class="pc-item con-item" data-anim-role="list-item" data-slot="con2">
                  <span class="pc-icon con-icon">✗</span>
                  <span>建设成本极高</span>
                </div>
                <div class="pc-item con-item" data-anim-role="list-item" data-slot="con3">
                  <span class="pc-icon con-icon">✗</span>
                  <span>事故风险虽小但后果严重</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.35" data-duration="1.2" data-track-index="102" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
    </div>
    <!-- ===== Layer 2: motion (slide_in_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["slide_in_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 24, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.12);
        }
        if ($("title").length) {
          tl.from($("title"), { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.50);
        }
        if ($("stat").length) {
          tl.from($("stat"), { x: -40, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.40);
        }
        if ($("unit").length) {
          tl.from($("unit"), { x: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.60);
        }
        if ($("card").length) {
          var cards = $("card");
          for (var i = 0; i < cards.length; i++) {
            var xOff = (i % 2 === 0) ? -60 : 60;
            tl.from(cards[i], { x: xOff, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.35 + i * 0.12);
          }
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 14, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { x: 40, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.30);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.75);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: -16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.80);
        }
        if ($("cta").length) {
          tl.from($("cta"), { y: 20, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.85);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.55);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 6.5, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["slide_in_hold"]) {
              window.__hf_motions["slide_in_hold"](tl, { gsap: gsap, root: root, duration: 6.5, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
