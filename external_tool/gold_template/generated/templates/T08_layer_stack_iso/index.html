<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "标题", "default": "大模型应用的三层结构"}, {"id": "layer1", "type": "string", "label": "第一层", "default": "应用层 · 对话与编排"}, {"id": "layer2", "type": "string", "label": "第二层", "default": "模型层 · 推理与微调"}, {"id": "layer3", "type": "string", "label": "第三层", "default": "数据层 · 向量与知识库"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (dark_tech) ===== */
      :root {
        --bg: #060d1a;
        --bg-2: #0a1525;
        --surface: rgba(20,38,60,.55);
        --surface-2: rgba(20,38,60,.82);
        --ink-1: #eef6fb;
        --ink-2: #b9d3e6;
        --ink-3: #7d96ad;
        --accent: #7fc7d9;
        --accent-2: #f5b14a;
        --danger: #ff7a7a;
        --success: #6ee7b7;
        --line: rgba(127,199,217,.18);
        --line-strong: rgba(127,199,217,.42);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 22px;
        --radius-pill: 999px;
        --shadow-soft: 0 12px 36px rgba(0,0,0,.45);
        --shadow-glow: 0 0 36px rgba(127,199,217,.35);
        --grid-color: rgba(127,199,217,.05);
        --stage-bg: rgba(10,21,37,.5);
        --radius-stage: 48px;
        --stage-blur: 10px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 60% at 30% 40%, rgba(127,199,217,.10) 0%, transparent 70%),
          radial-gradient(ellipse 50% 50% at 75% 65%, rgba(245,177,74,.06) 0%, transparent 60%),
          repeating-linear-gradient(0deg, transparent, transparent 79px, var(--grid-color) 79px, var(--grid-color) 80px),
          repeating-linear-gradient(90deg, transparent, transparent 79px, var(--grid-color) 79px, var(--grid-color) 80px),
          var(--bg);
        mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 50%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 50%, transparent 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (layer_stack_iso) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 70px 90px;
        gap: 30px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .ls-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 60px;
        line-height: 1.2;
        color: var(--ink-1);
        text-align: center;
        max-width: 1100px;
      }

      [data-hf="structure-dom"] .ls-line {
        width: 96px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      [data-hf="structure-dom"] .ls-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        justify-content: center;
        min-height: 0;
        gap: 0;
      }

      [data-hf="structure-dom"] .ls-layer {
        width: 620px;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-soft);
        transform: skewX(-26deg);
        margin-top: -22px;
      }

      [data-hf="structure-dom"] .ls-layer.l1 { background: var(--surface-2); border-color: var(--accent); box-shadow: var(--shadow-glow); margin-top: 0; margin-left: 120px; }
      [data-hf="structure-dom"] .ls-layer.l2 { background: var(--surface-2); margin-left: 0; }
      [data-hf="structure-dom"] .ls-layer.l3 { background: var(--surface); margin-left: -120px; }

      [data-hf="structure-dom"] .ls-label {
        transform: skewX(26deg);
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 30px;
        line-height: 1.3;
        color: var(--ink-1);
        text-align: center;
        padding: 0 20px;
      }

      [data-hf="structure-dom"] .ls-layer.l1 .ls-label { color: var(--ink-1); }
      [data-hf="structure-dom"] .ls-layer.l3 .ls-label { color: var(--ink-2); }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="6.0" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="6.0" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="ls-title" data-anim-role="title" data-slot="headline">系统的三层结构</h2>
            <div class="ls-line" data-anim-role="accent-line"></div>
            <div class="ls-stack">
              <div class="ls-layer l1" data-anim-role="card">
                <span class="ls-label" data-slot="layer1">应用层 · 面向用户的交互</span>
              </div>
              <div class="ls-layer l2" data-anim-role="card">
                <span class="ls-label" data-slot="layer2">模型层 · 推理与决策</span>
              </div>
              <div class="ls-layer l3" data-anim-role="card">
                <span class="ls-label" data-slot="layer3">数据层 · 存储与检索</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="1.2" data-track-index="102" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
      <audio id="sfx-1" data-start="0.4" data-duration="1.2" data-track-index="103" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
      <audio id="sfx-2" data-start="1.1" data-duration="0.3" data-track-index="104" src="sfx/tick.mp3" data-volume="0.25"></audio>
    </div>
    <!-- ===== Layer 2: motion (card_stack_sequence) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["card_stack_sequence"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.10);
        }
        if ($("title").length) {
          tl.from($("title"), { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 18, opacity: 0, duration: 0.45, ease: "expo.out" }, 0.50);
        }
        if ($("stat").length) {
          tl.from($("stat"), { y: 40, opacity: 0, scale: 0.96, duration: 0.5, ease: "back.out(1.3)" }, 0.50);
        }
        if ($("unit").length) {
          tl.from($("unit"), { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.75);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.7, ease: "expo.out", transformOrigin: "left center" }, 0.30);
        }
        if ($("card").length) {
          tl.from($("card"), { y: 40, opacity: 0, scale: 0.96, duration: 0.5, ease: "back.out(1.3)", stagger: 0.22 }, 0.70);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.18 }, 1.10);
        }
        if ($("media").length) {
          tl.from($("media"), { y: 30, opacity: 0, scale: 0.96, duration: 0.5, ease: "back.out(1.2)" }, 0.55);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.20);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: -12, opacity: 0, duration: 0.35, ease: "power2.out" }, 1.30);
        }
        if ($("cta").length) {
          tl.from($("cta"), { y: 20, opacity: 0, scale: 0.96, duration: 0.45, ease: "back.out(1.2)" }, 1.40);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 6.0, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["card_stack_sequence"]) {
              window.__hf_motions["card_stack_sequence"](tl, { gsap: gsap, root: root, duration: 6.0, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
