<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "图表标题", "default": "中国新能源汽车销量"}, {"id": "series", "type": "string", "label": "数据系列", "default": "[{\"label\": \"2020\", \"value\": 136.7}, {\"label\": \"2021\", \"value\": 352.1}, {\"label\": \"2022\", \"value\": 688.7}, {\"label\": \"2023\", \"value\": 949.5}, {\"label\": \"2024\", \"value\": 1286.6}]"}, {"id": "unit", "type": "string", "label": "数值单位", "default": "万辆"}, {"id": "source_note", "type": "string", "label": "数据来源", "default": "数据来源：中汽协 2024"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (clean_saas) ===== */
      :root {
        --bg: #f7f9fc;
        --bg-2: #eef2f8;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --danger: #ef4444;
        --success: #10b981;
        --line: rgba(15,23,42,.08);
        --line-strong: rgba(15,23,42,.16);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 20px;
        --radius-pill: 999px;
        --shadow-soft: 0 16px 40px rgba(15,23,42,.10);
        --shadow-glow: 0 0 30px rgba(79,70,229,.18);
        --grid-color: rgba(15,23,42,.04);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 40px;
        --stage-blur: 8px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 45%, rgba(79,70,229,.06) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 80% 70%, rgba(14,165,233,.04) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (bar_chart) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 60px 80px 50px;
        gap: 20px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .chart-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 64px;
        line-height: 1.2;
        color: var(--ink-1);
        max-width: 1000px;
      }

      [data-hf="structure-dom"] .chart-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        min-height: 0;
      }

      [data-hf="structure-dom"] .chart-grid {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
      }

      [data-hf="structure-dom"] .chart-grid-line {
        width: 100%;
        height: 1px;
        background: var(--line);
      }

      [data-hf="structure-dom"] .chart-baseline {
        width: 100%;
        height: 2px;
        background: var(--line-strong);
      }

      [data-hf="structure-dom"] .chart-bars-container {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 0 40px;
        position: relative;
        z-index: 1;
      }

      [data-hf="structure-dom"] .bar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        flex: 1;
        max-width: 140px;
        height: 100%;
        justify-content: flex-end;
      }

      [data-hf="structure-dom"] .bar-value {
        font-family: var(--font-body);
        font-weight: var(--weight-display);
        font-size: 26px;
        color: var(--ink-1);
        font-variant-numeric: tabular-nums;
      }

      [data-hf="structure-dom"] .bar-rect {
        width: 100%;
        border-radius: 8px 8px 0 0;
        background: var(--accent);
        transform-origin: bottom center;
        min-height: 8px;
      }

      [data-hf="structure-dom"] .bar-group:nth-child(even) .bar-rect {
        background: var(--accent-2);
      }

      [data-hf="structure-dom"] .bar-label {
        font-family: var(--font-caption);
        font-weight: var(--weight-body);
        font-size: 22px;
        color: var(--ink-2);
        text-align: center;
        white-space: nowrap;
      }

      [data-hf="structure-dom"] .chart-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      [data-hf="structure-dom"] .chart-source {
        font-family: var(--font-caption);
        font-weight: var(--weight-body);
        font-size: 18px;
        color: var(--ink-3);
      }

      [data-hf="structure-dom"] .chart-divider {
        flex: 1;
        height: 1px;
        background: var(--line);
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7.0" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="chart-title" data-anim-role="title" data-slot="headline">全球市场规模变化趋势</h2>
            <div class="chart-area">
              <div class="chart-grid" data-anim-role="chart-axis">
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
                <div class="chart-baseline"></div>
              </div>
              <div class="chart-bars-container" data-anim-role="chart-bars">
                <div class="bar-group">
                  <span class="bar-value" data-anim-role="chart-value">1.2</span>
                  <div class="bar-rect" data-anim-role="chart-bar" style="height: 18%"></div>
                  <span class="bar-label" data-anim-role="chart-label">2021</span>
                </div>
                <div class="bar-group">
                  <span class="bar-value" data-anim-role="chart-value">2.8</span>
                  <div class="bar-rect" data-anim-role="chart-bar" style="height: 43%"></div>
                  <span class="bar-label" data-anim-role="chart-label">2022</span>
                </div>
                <div class="bar-group">
                  <span class="bar-value" data-anim-role="chart-value">4.1</span>
                  <div class="bar-rect" data-anim-role="chart-bar" style="height: 63%"></div>
                  <span class="bar-label" data-anim-role="chart-label">2023</span>
                </div>
                <div class="bar-group">
                  <span class="bar-value" data-anim-role="chart-value">6.5</span>
                  <div class="bar-rect" data-anim-role="chart-bar" style="height: 100%"></div>
                  <span class="bar-label" data-anim-role="chart-label">2024</span>
                </div>
              </div>
            </div>
            <div class="chart-footer">
              <span class="chart-source" data-slot="source_note">数据来源：Statista 2024</span>
              <div class="chart-divider" data-anim-role="accent-line"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="0.6" data-track-index="102" src="sfx/pop.mp3" data-volume="0.3"></audio>
    </div>
    <!-- ===== Structure self-animation (bar_chart) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("title").length) {
          tl.from($("title"), { y: -20, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.1);
        }
        if ($("chart-axis").length) {
          tl.from($("chart-axis"), { scaleX: 0, opacity: 0, duration: 0.4, ease: "power2.out", transformOrigin: "left center" }, 0.2);
        }

        var barsContainer = root.querySelector('[data-anim-role="chart-bars"]');
        var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
        var seriesRaw = V.series || null;
        var series = null;
        if (seriesRaw) {
          try { series = typeof seriesRaw === "string" ? JSON.parse(seriesRaw) : seriesRaw; } catch (e) { series = null; }
        }

        if (series && Array.isArray(series) && series.length > 0 && barsContainer) {
          barsContainer.innerHTML = "";
          var maxVal = 0;
          for (var i = 0; i < series.length; i++) {
            if (series[i].value > maxVal) maxVal = series[i].value;
          }
          if (maxVal === 0) maxVal = 1;
          var unit = V.unit || "";
          for (var j = 0; j < series.length; j++) {
            var pct = Math.round((series[j].value / maxVal) * 100);
            var group = document.createElement("div");
            group.className = "bar-group";
            var valEl = document.createElement("span");
            valEl.className = "bar-value";
            valEl.setAttribute("data-anim-role", "chart-value");
            valEl.textContent = String(series[j].value) + (unit ? " " + unit : "");
            valEl.style.fontVariantNumeric = "tabular-nums";
            var barEl = document.createElement("div");
            barEl.className = "bar-rect";
            barEl.setAttribute("data-anim-role", "chart-bar");
            barEl.style.height = pct + "%";
            barEl.style.transformOrigin = "bottom center";
            if (j % 2 === 1) { barEl.style.background = "var(--accent-2)"; }
            var lblEl = document.createElement("span");
            lblEl.className = "bar-label";
            lblEl.setAttribute("data-anim-role", "chart-label");
            lblEl.textContent = series[j].label;
            group.appendChild(valEl);
            group.appendChild(barEl);
            group.appendChild(lblEl);
            barsContainer.appendChild(group);
          }
        }

        var bars = $("chart-bar");
        if (bars.length) {
          tl.from(bars, { scaleY: 0, duration: 0.6, ease: "back.out(1.2)", stagger: 0.08 }, 0.55);
        }
        var vals = $("chart-value");
        if (vals.length) {
          tl.from(vals, { opacity: 0, y: 10, duration: 0.35, ease: "power2.out", stagger: 0.08 }, 0.85);
        }
        var labels = $("chart-label");
        if (labels.length) {
          tl.from(labels, { opacity: 0, duration: 0.3, ease: "power1.out", stagger: 0.06 }, 0.75);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.4, ease: "power2.out", transformOrigin: "left center" }, 1.2);
        }
      };
    </script>
    <!-- ===== Layer 2: motion (scale_pop_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["scale_pop_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        }
        if ($("title").length) {
          tl.from($("title"), { scale: 0.82, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 24, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.62);
        }
        if ($("stat").length) {
          tl.from($("stat"), { scale: 0.75, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("unit").length) {
          tl.from($("unit"), { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.65);
        }
        if ($("card").length) {
          tl.from($("card"), { scale: 0.92, opacity: 0, duration: 0.55, ease: "back.out(1.3)", stagger: 0.15 }, 0.40);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.10 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { scale: 0.94, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.35);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.80);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.85);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.90);
        }
        if ($("cta").length) {
          tl.from($("cta"), { scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.0);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["scale_pop_hold"]) {
              window.__hf_motions["scale_pop_hold"](tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
