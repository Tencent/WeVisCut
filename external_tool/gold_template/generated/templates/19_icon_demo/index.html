<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "概要标题", "default": "蒸馏后的三个关键变化"}, {"id": "icon1_value", "type": "string", "label": "图标1数值", "default": "8×"}, {"id": "icon1_label", "type": "string", "label": "图标1说明", "default": "推理提速"}, {"id": "icon2_value", "type": "string", "label": "图标2数值", "default": "95%"}, {"id": "icon2_label", "type": "string", "label": "图标2说明", "default": "效果保留"}, {"id": "icon3_value", "type": "string", "label": "图标3数值", "default": "1/4"}, {"id": "icon3_label", "type": "string", "label": "图标3说明", "default": "显存占用"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (clean_saas) ===== */
      :root {
        --bg: #f7f9fc;
        --bg-2: #eef2f8;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --danger: #ef4444;
        --success: #10b981;
        --line: rgba(15,23,42,.08);
        --line-strong: rgba(15,23,42,.16);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 20px;
        --radius-pill: 999px;
        --shadow-soft: 0 16px 40px rgba(15,23,42,.10);
        --shadow-glow: 0 0 30px rgba(79,70,229,.18);
        --grid-color: rgba(15,23,42,.04);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 40px;
        --stage-blur: 8px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 45%, rgba(79,70,229,.06) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 80% 70%, rgba(14,165,233,.04) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (icon_overview) ===== */
      [data-hf="structure-dom"] {
        position: relative;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 56px 70px;
        overflow: hidden;
      }

      [data-hf="structure-dom"] .io-title {
        position: absolute;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 60px;
        line-height: 1.2;
        color: var(--ink-1);
        text-align: center;
        max-width: 1000px;
      }

      [data-hf="structure-dom"] .io-card {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 320px;
        padding: 32px 28px;
        border-radius: var(--radius-card);
        background: var(--stage-bg);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-soft);
      }

      [data-hf="structure-dom"] .io-card.c1 { left: 8%; top: 34%; }
      [data-hf="structure-dom"] .io-card.c2 { left: 50%; top: 48%; transform: translateX(-50%); }
      [data-hf="structure-dom"] .io-card.c3 { right: 8%; top: 32%; }

      [data-hf="structure-dom"] .io-icon {
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-hf="structure-dom"] .io-icon svg { width: 100%; height: 100%; display: block; }

      [data-hf="structure-dom"] .io-stat {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 56px;
        line-height: 1.1;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      [data-hf="structure-dom"] .io-card.c2 .io-stat { color: var(--accent-2); }
      [data-hf="structure-dom"] .io-card.c3 .io-stat { color: var(--success); }

      [data-hf="structure-dom"] .io-caption {
        font-family: var(--font-body);
        font-weight: var(--weight-body);
        font-size: 24px;
        color: var(--ink-2);
        text-align: center;
      }

      [data-hf="structure-dom"] .io-line {
        position: absolute;
        left: 50%;
        bottom: 56px;
        transform: translateX(-50%);
        width: 140px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="io-title" data-anim-role="title" data-slot="headline">三个关键指标</h2>

            <div class="io-card c1">
              <span class="io-icon" data-anim-role="icon">
                <svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round">
                  <circle cx="21" cy="21" r="13"></circle>
                  <line x1="31" y1="31" x2="41" y2="41"></line>
                </svg>
              </span>
              <span class="io-stat" data-anim-role="stat" data-slot="icon1_value">10×</span>
              <span class="io-caption" data-anim-role="caption" data-slot="icon1_label">推理加速</span>
            </div>

            <div class="io-card c2">
              <span class="io-icon" data-anim-role="icon">
                <svg viewBox="0 0 48 48" fill="none" stroke="var(--accent-2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M24 6c-8 0-13 5.5-13 13 0 5 2.6 8 5.5 10.5 1.5 1.3 2.5 2.5 2.5 4.5h10c0-2 1-3.2 2.5-4.5C37.4 27 40 24 40 19 40 11.5 32 6 24 6Z"></path>
                  <line x1="19" y1="40" x2="29" y2="40"></line>
                  <line x1="21" y1="44" x2="27" y2="44"></line>
                </svg>
              </span>
              <span class="io-stat" data-anim-role="stat" data-slot="icon2_value">92%</span>
              <span class="io-caption" data-anim-role="caption" data-slot="icon2_label">召回准确率</span>
            </div>

            <div class="io-card c3">
              <span class="io-icon" data-anim-role="icon">
                <svg viewBox="0 0 48 48" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="24" cy="24" r="7"></circle>
                  <path d="M24 5v6M24 37v6M5 24h6M37 24h6M11 11l4 4M33 33l4 4M37 11l-4 4M15 33l-4 4"></path>
                </svg>
              </span>
              <span class="io-stat" data-anim-role="stat" data-slot="icon3_value">1/5</span>
              <span class="io-caption" data-anim-role="caption" data-slot="icon3_label">部署成本</span>
            </div>

            <div class="io-line" data-anim-role="accent-line"></div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="0.6" data-track-index="102" src="sfx/pop.mp3" data-volume="0.3"></audio>
      <audio id="sfx-1" data-start="0.2" data-duration="0.6" data-track-index="103" src="sfx/pop.mp3" data-volume="0.3"></audio>
      <audio id="sfx-2" data-start="0.5" data-duration="1.5" data-track-index="104" src="sfx/sparkle.mp3" data-volume="0.4"></audio>
    </div>
    <!-- ===== Structure self-animation (icon_overview) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var icons = root.querySelectorAll('[data-anim-role="icon"]');
        if (icons.length) {
          tl.from(icons, { scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.1, transformOrigin: "center center" }, 0.2);
          for (var i = 0; i < icons.length; i++) { icons[i].removeAttribute("data-anim-role"); }
        }
      };
    </script>
    <!-- ===== Layer 2: motion (scale_pop_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["scale_pop_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        }
        if ($("title").length) {
          tl.from($("title"), { scale: 0.82, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 24, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.62);
        }
        if ($("stat").length) {
          tl.from($("stat"), { scale: 0.75, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("unit").length) {
          tl.from($("unit"), { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.65);
        }
        if ($("card").length) {
          tl.from($("card"), { scale: 0.92, opacity: 0, duration: 0.55, ease: "back.out(1.3)", stagger: 0.15 }, 0.40);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.10 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { scale: 0.94, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.35);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.80);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.85);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.90);
        }
        if ($("cta").length) {
          tl.from($("cta"), { scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.0);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 5.5, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["scale_pop_hold"]) {
              window.__hf_motions["scale_pop_hold"](tl, { gsap: gsap, root: root, duration: 5.5, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
