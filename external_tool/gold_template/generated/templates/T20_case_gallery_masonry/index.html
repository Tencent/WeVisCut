<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "标题", "default": "创作者的五种玩法"}, {"id": "cases", "type": "string", "label": "案例宫格", "default": "[{\"caption\": \"公众号配图\"}, {\"caption\": \"电商主图\"}, {\"caption\": \"PPT 插图\"}, {\"caption\": \"表情包\"}, {\"caption\": \"壁纸生成\"}]"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (clean_saas) ===== */
      :root {
        --bg: #f7f9fc;
        --bg-2: #eef2f8;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --danger: #ef4444;
        --success: #10b981;
        --line: rgba(15,23,42,.08);
        --line-strong: rgba(15,23,42,.16);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 20px;
        --radius-pill: 999px;
        --shadow-soft: 0 16px 40px rgba(15,23,42,.10);
        --shadow-glow: 0 0 30px rgba(79,70,229,.18);
        --grid-color: rgba(15,23,42,.04);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 40px;
        --stage-blur: 8px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 45%, rgba(79,70,229,.06) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 80% 70%, rgba(14,165,233,.04) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (case_gallery_masonry) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 56px 80px 48px;
        gap: 24px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .cgm-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 60px;
        line-height: 1.2;
        color: var(--ink-1);
        max-width: 1100px;
      }

      [data-hf="structure-dom"] .cgm-grid {
        flex: 1;
        column-count: 3;
        column-gap: 24px;
        min-height: 0;
        overflow: hidden;
      }

      [data-hf="structure-dom"] .cgm-cell {
        break-inside: avoid;
        width: 100%;
        margin-bottom: 24px;
        position: relative;
        border-radius: var(--radius-card);
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: var(--shadow-soft);
        display: flex;
        align-items: flex-end;
      }

      [data-hf="structure-dom"] .cgm-grid > .cgm-cell:nth-child(6n+1) { height: 240px; background: linear-gradient(135deg, transparent 0%, var(--accent) 130%), var(--surface-2); }
      [data-hf="structure-dom"] .cgm-grid > .cgm-cell:nth-child(6n+2) { height: 320px; background: radial-gradient(ellipse 80% 90% at 30% 20%, var(--accent-2) 0%, transparent 70%), var(--surface-2); }
      [data-hf="structure-dom"] .cgm-grid > .cgm-cell:nth-child(6n+3) { height: 270px; background: linear-gradient(150deg, var(--accent) 0%, transparent 75%), var(--surface-2); }
      [data-hf="structure-dom"] .cgm-grid > .cgm-cell:nth-child(6n+4) { height: 300px; background: radial-gradient(ellipse 90% 80% at 70% 80%, var(--ink-3) 0%, transparent 75%), var(--surface-2); }
      [data-hf="structure-dom"] .cgm-grid > .cgm-cell:nth-child(6n+5) { height: 230px; background: linear-gradient(120deg, var(--accent-2) 0%, transparent 70%), var(--surface-2); }
      [data-hf="structure-dom"] .cgm-grid > .cgm-cell:nth-child(6n+6) { height: 290px; background: radial-gradient(ellipse 85% 85% at 40% 30%, var(--accent) 0%, transparent 72%), var(--surface-2); }

      [data-hf="structure-dom"] .cgm-cell-label {
        position: relative;
        z-index: 1;
        width: 100%;
        font-family: var(--font-body);
        font-weight: var(--weight-display);
        font-size: 26px;
        color: var(--ink-1);
        padding: 18px 22px;
        background: linear-gradient(0deg, var(--surface-2) 0%, transparent 100%);
      }

      [data-hf="structure-dom"] .cgm-divider {
        width: 100%;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7.0" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="cgm-title" data-anim-role="title" data-slot="headline">同一个模型，多种落地</h2>

            <div class="cgm-grid">
              <div class="cgm-cell" data-anim-role="cell">
                <div class="cgm-cell-label" data-anim-role="cell-label">电商详情页</div>
              </div>
              <div class="cgm-cell" data-anim-role="cell">
                <div class="cgm-cell-label" data-anim-role="cell-label">教育课件</div>
              </div>
              <div class="cgm-cell" data-anim-role="cell">
                <div class="cgm-cell-label" data-anim-role="cell-label">医疗报告</div>
              </div>
              <div class="cgm-cell" data-anim-role="cell">
                <div class="cgm-cell-label" data-anim-role="cell-label">金融风控</div>
              </div>
              <div class="cgm-cell" data-anim-role="cell">
                <div class="cgm-cell-label" data-anim-role="cell-label">智能客服</div>
              </div>
              <div class="cgm-cell" data-anim-role="cell">
                <div class="cgm-cell-label" data-anim-role="cell-label">内容创作</div>
              </div>
            </div>

            <div class="cgm-divider" data-anim-role="accent-line"></div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="0.6" data-track-index="102" src="sfx/pop.mp3" data-volume="0.3"></audio>
      <audio id="sfx-1" data-start="0.2" data-duration="0.6" data-track-index="103" src="sfx/pop.mp3" data-volume="0.3"></audio>
      <audio id="sfx-2" data-start="1.2" data-duration="0.3" data-track-index="104" src="sfx/tick.mp3" data-volume="0.25"></audio>
    </div>
    <!-- ===== Structure self-animation (case_gallery_masonry) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        var grid = root.querySelector(".cgm-grid");
        var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
        function parse(raw) {
          if (raw == null) return null;
          if (typeof raw !== "string") return raw;
          try { return JSON.parse(raw); } catch (e) { return null; }
        }
        var cases = parse(V.cases);

        if (grid && Array.isArray(cases) && cases.length >= 1) {
          grid.innerHTML = "";
          grid.style.columnCount = String(cases.length <= 4 ? 2 : 3);
          for (var i = 0; i < cases.length; i++) {
            var cell = document.createElement("div");
            cell.className = "cgm-cell";
            cell.setAttribute("data-anim-role", "cell");
            var label = document.createElement("div");
            label.className = "cgm-cell-label";
            label.setAttribute("data-anim-role", "cell-label");
            label.textContent = String(cases[i].caption != null ? cases[i].caption : "");
            cell.appendChild(label);
            grid.appendChild(cell);
          }
        }

        var cells = $("cell");
        if (cells.length) {
          gsap.set(cells, { transformOrigin: "center center" });
          tl.from(cells, { scale: 0.86, y: 24, opacity: 0, duration: 0.5, ease: "back.out(1.4)", stagger: 0.1 }, 0.2);
        }
        var labels = $("cell-label");
        if (labels.length) {
          tl.from(labels, { y: 16, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, 0.45);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.35);
        }
        if (cells.length) {
          var base = 0.3 + cells.length * 0.1 + 0.4;
          for (var z = 0; z < cells.length; z++) {
            var at = base + z * 0.3;
            tl.to(cells[z], { scale: 1.05, duration: 0.2, ease: "power2.out" }, at);
            tl.to(cells[z], { scale: 1.0, duration: 0.28, ease: "power2.inOut" }, at + 0.2);
          }
        }

        var done = ["cell", "cell-label", "accent-line"];
        for (var d = 0; d < done.length; d++) {
          var els = $(done[d]);
          for (var k = 0; k < els.length; k++) els[k].removeAttribute("data-anim-role");
        }
      };
    </script>
    <!-- ===== Layer 2: motion (scale_pop_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["scale_pop_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        }
        if ($("title").length) {
          tl.from($("title"), { scale: 0.82, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 24, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.62);
        }
        if ($("stat").length) {
          tl.from($("stat"), { scale: 0.75, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("unit").length) {
          tl.from($("unit"), { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.65);
        }
        if ($("card").length) {
          tl.from($("card"), { scale: 0.92, opacity: 0, duration: 0.55, ease: "back.out(1.3)", stagger: 0.15 }, 0.40);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.10 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { scale: 0.94, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.35);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.80);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.85);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.90);
        }
        if ($("cta").length) {
          tl.from($("cta"), { scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.0);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["scale_pop_hold"]) {
              window.__hf_motions["scale_pop_hold"](tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
