<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "type": "string", "label": "顶部标签", "default": "临床研究 · 2024"}, {"id": "stat_value", "type": "string", "label": "核心数字", "default": "73.6"}, {"id": "unit", "type": "string", "label": "单位", "default": "%"}, {"id": "caption_text", "type": "string", "label": "说明文字", "default": "受试者症状显著改善"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (clean_saas) ===== */
      :root {
        --bg: #f7f9fc;
        --bg-2: #eef2f8;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --danger: #ef4444;
        --success: #10b981;
        --line: rgba(15,23,42,.08);
        --line-strong: rgba(15,23,42,.16);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 20px;
        --radius-pill: 999px;
        --shadow-soft: 0 16px 40px rgba(15,23,42,.10);
        --shadow-glow: 0 0 30px rgba(79,70,229,.18);
        --grid-color: rgba(15,23,42,.04);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 40px;
        --stage-blur: 8px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 45%, rgba(79,70,229,.06) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 80% 70%, rgba(14,165,233,.04) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (stat_highlight) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 80px 120px;
        gap: 16px;
        box-sizing: border-box;
        text-align: center;
      }

      [data-hf="structure-dom"] .eyebrow-pill {
        display: inline-flex;
        align-items: center;
        padding: 8px 28px;
        border-radius: var(--radius-pill);
        background: var(--surface);
        border: 1px solid var(--line);
        font-family: var(--font-caption);
        font-weight: var(--weight-body);
        font-size: 22px;
        color: var(--ink-2);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      [data-hf="structure-dom"] .stat-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 12px;
        margin: 16px 0;
      }

      [data-hf="structure-dom"] .stat-value {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 200px;
        line-height: 1.0;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      [data-hf="structure-dom"] .stat-unit {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 72px;
        line-height: 1.0;
        color: var(--accent-2);
      }

      [data-hf="structure-dom"] .stat-caption {
        font-family: var(--font-body);
        font-weight: var(--weight-body);
        font-size: 32px;
        line-height: 1.5;
        color: var(--ink-2);
        max-width: 800px;
      }

      [data-hf="structure-dom"] .accent-bar {
        width: 100px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        margin-top: 8px;
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <div class="eyebrow-pill" data-anim-role="eyebrow" data-slot="eyebrow">Lancet · 临床三期试验 · 2024</div>
            <div class="stat-row">
              <span class="stat-value" data-anim-role="stat" data-slot="stat_value">73.6</span>
              <span class="stat-unit" data-anim-role="unit" data-slot="unit">%</span>
            </div>
            <p class="stat-caption" data-anim-role="subtitle" data-slot="caption_text">受试者在12周疗程后症状出现显著改善</p>
            <div class="accent-bar" data-anim-role="accent-line"></div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="0.6" data-track-index="102" src="sfx/pop.mp3" data-volume="0.3"></audio>
    </div>
    <!-- ===== Structure self-animation (stat_highlight) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: -16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.1);
        }

        if ($("stat").length) {
          var el = $("stat")[0];
          var raw = el.textContent.replace(/,/g, "");
          var final_val = parseFloat(raw);
          if (isNaN(final_val)) { final_val = 0; }
          var hasComma = el.textContent.indexOf(",") !== -1;
          var decimals = (raw.indexOf(".") !== -1) ? raw.split(".")[1].length : 0;
          var obj = { v: 0 };
          tl.from(el, { opacity: 0, duration: 0.01 }, 0.29);
          tl.to(obj, {
            v: final_val, duration: 1.4, ease: "power2.out",
            onUpdate: function () {
              var s = obj.v.toFixed(decimals);
              if (hasComma) {
                var parts = s.split(".");
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                s = parts.join(".");
              }
              el.textContent = s;
            }
          }, 0.3);
        }

        if ($("unit").length) {
          tl.from($("unit"), { x: -12, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.8);
        }

        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 12, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.2);
        }

        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.5);
        }

        var roles = ["eyebrow", "stat", "unit", "subtitle", "accent-line"];
        for (var r = 0; r < roles.length; r++) {
          var els = $(roles[r]);
          for (var i = 0; i < els.length; i++) els[i].removeAttribute("data-anim-role");
        }
      };
    </script>
    <!-- ===== Layer 2: motion (scale_pop_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["scale_pop_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        }
        if ($("title").length) {
          tl.from($("title"), { scale: 0.82, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 24, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.62);
        }
        if ($("stat").length) {
          tl.from($("stat"), { scale: 0.75, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.30);
        }
        if ($("unit").length) {
          tl.from($("unit"), { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.65);
        }
        if ($("card").length) {
          tl.from($("card"), { scale: 0.92, opacity: 0, duration: 0.55, ease: "back.out(1.3)", stagger: 0.15 }, 0.40);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.10 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { scale: 0.94, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.35);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.80);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.85);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.90);
        }
        if ($("cta").length) {
          tl.from($("cta"), { scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.0);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 5.5, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["scale_pop_hold"]) {
              window.__hf_motions["scale_pop_hold"](tl, { gsap: gsap, root: root, duration: 5.5, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
