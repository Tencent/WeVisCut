<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "主标题", "default": "维生素D缺乏的三阶段"}, {"id": "step1_title", "type": "string", "label": "阶段1标题", "default": "隐性不足"}, {"id": "step1_desc", "type": "string", "label": "阶段1描述", "default": "血清25-OH-D低于30ng/ml"}, {"id": "step2_title", "type": "string", "label": "阶段2标题", "default": "功能缺乏"}, {"id": "step2_desc", "type": "string", "label": "阶段2描述", "default": "骨密度下降、肌力减退"}, {"id": "step3_title", "type": "string", "label": "阶段3标题", "default": "临床缺乏"}, {"id": "step3_desc", "type": "string", "label": "阶段3描述", "default": "佝偻病或骨软化症出现"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (minimal_academic) ===== */
      :root {
        --bg: #fbfbf9;
        --bg-2: #f3f3ee;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #1a2238;
        --ink-2: #454f6b;
        --ink-3: #8b93a7;
        --accent: #2f5d8a;
        --accent-2: #b08328;
        --danger: #9b2c2c;
        --success: #2f7a55;
        --line: rgba(26,34,56,.10);
        --line-strong: rgba(26,34,56,.24);
        --font-display: "Noto Serif SC", Georgia, serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 700;
        --weight-body: 400;
        --radius-card: 4px;
        --radius-pill: 999px;
        --shadow-soft: none;
        --shadow-glow: none;
        --grid-color: rgba(26,34,56,.05);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 22px;
        --stage-blur: 0px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        border-bottom: 1px solid var(--line);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (timeline_step) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 72px 100px;
        gap: 32px;
        box-sizing: border-box;
        text-align: center;
      }

      [data-hf="structure-dom"] .section-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 72px;
        line-height: 1.15;
        color: var(--ink-1);
        max-width: 1000px;
      }

      [data-hf="structure-dom"] .timeline-axis {
        width: 80%;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      [data-hf="structure-dom"] .steps-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 36px;
        width: 80%;
      }

      [data-hf="structure-dom"] .step-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 32px 24px;
        border-radius: var(--radius-card);
        background: var(--surface);
        border: 1px solid var(--line);
        text-align: center;
      }

      [data-hf="structure-dom"] .step-number {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 28px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      [data-hf="structure-dom"] .step-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 28px;
        line-height: 1.3;
        color: var(--ink-1);
        max-width: 280px;
      }

      [data-hf="structure-dom"] .step-desc {
        font-family: var(--font-body);
        font-weight: var(--weight-body);
        font-size: 22px;
        line-height: 1.5;
        color: var(--ink-2);
        max-width: 280px;
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7.0" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h1 class="section-title" data-anim-role="title" data-slot="headline">维生素D缺乏的三个阶段，你在哪一步？</h1>
            <div class="timeline-axis" data-anim-role="accent-line"></div>
            <div class="steps-row">
              <div class="step-card" data-anim-role="card">
                <span class="step-number">01</span>
                <h2 class="step-title" data-anim-role="list-item" data-slot="step1_title">第一阶段：隐性不足</h2>
                <p class="step-desc" data-slot="step1_desc">血清25-OH-D低于30ng/ml，无明显症状但骨代谢已受影响</p>
              </div>
              <div class="step-card" data-anim-role="card">
                <span class="step-number">02</span>
                <h2 class="step-title" data-anim-role="list-item" data-slot="step2_title">第二阶段：功能缺乏</h2>
                <p class="step-desc" data-slot="step2_desc">骨密度显著下降、肌力减退，疲劳感加重、免疫力降低</p>
              </div>
              <div class="step-card" data-anim-role="card">
                <span class="step-number">03</span>
                <h2 class="step-title" data-anim-role="list-item" data-slot="step3_title">第三阶段：临床缺乏</h2>
                <p class="step-desc" data-slot="step3_desc">出现佝偻病或骨软化症，需即刻医学干预治疗</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.35" data-duration="1.2" data-track-index="102" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
    </div>
    <!-- ===== Layer 2: motion (slide_in_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["slide_in_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 24, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.12);
        }
        if ($("title").length) {
          tl.from($("title"), { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.50);
        }
        if ($("stat").length) {
          tl.from($("stat"), { x: -40, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.40);
        }
        if ($("unit").length) {
          tl.from($("unit"), { x: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.60);
        }
        if ($("card").length) {
          var cards = $("card");
          for (var i = 0; i < cards.length; i++) {
            var xOff = (i % 2 === 0) ? -60 : 60;
            tl.from(cards[i], { x: xOff, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.35 + i * 0.12);
          }
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 14, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { x: 40, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.30);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.75);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: -16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.80);
        }
        if ($("cta").length) {
          tl.from($("cta"), { y: 20, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.85);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.55);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["slide_in_hold"]) {
              window.__hf_motions["slide_in_hold"](tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
