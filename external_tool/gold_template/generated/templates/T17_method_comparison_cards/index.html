<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "对比标题", "default": "两套方案怎么选"}, {"id": "columns", "type": "string", "label": "方法列名", "default": "[\"开源自建\", \"托管服务\"]"}, {"id": "rows", "type": "string", "label": "维度行数据", "default": "[{\"dim\": \"上手速度\", \"values\": [\"慢\", \"快\"]}, {\"dim\": \"月度成本\", \"values\": [\"¥800\", \"¥2400\"]}, {\"dim\": \"可定制性\", \"values\": [\"高\", \"中\"]}]"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (minimal_academic) ===== */
      :root {
        --bg: #fbfbf9;
        --bg-2: #f3f3ee;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #1a2238;
        --ink-2: #454f6b;
        --ink-3: #8b93a7;
        --accent: #2f5d8a;
        --accent-2: #b08328;
        --danger: #9b2c2c;
        --success: #2f7a55;
        --line: rgba(26,34,56,.10);
        --line-strong: rgba(26,34,56,.24);
        --font-display: "Noto Serif SC", Georgia, serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 700;
        --weight-body: 400;
        --radius-card: 4px;
        --radius-pill: 999px;
        --shadow-soft: none;
        --shadow-glow: none;
        --grid-color: rgba(26,34,56,.05);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 22px;
        --stage-blur: 0px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        border-bottom: 1px solid var(--line);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (method_comparison_cards) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 60px 80px 50px;
        gap: 30px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .mcc-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 64px;
        line-height: 1.2;
        color: var(--ink-1);
        max-width: 1200px;
      }

      [data-hf="structure-dom"] .mcc-cards {
        flex: 1;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 32px;
        min-height: 0;
      }

      [data-hf="structure-dom"] .mcc-card {
        flex: 1;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 12px 12px 20px;
        box-shadow: var(--shadow-soft);
      }

      [data-hf="structure-dom"] .mcc-head {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 34px;
        color: var(--ink-1);
        background: var(--surface-2);
        border-radius: var(--radius-card);
        padding: 18px 12px;
        text-align: center;
      }

      [data-hf="structure-dom"] .mcc-entry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      [data-hf="structure-dom"] .mcc-entry:last-child {
        border-bottom: none;
      }

      [data-hf="structure-dom"] .mcc-dim {
        font-family: var(--font-body);
        font-weight: var(--weight-body);
        font-size: 24px;
        color: var(--ink-3);
      }

      [data-hf="structure-dom"] .mcc-val {
        font-family: var(--font-body);
        font-weight: var(--weight-display);
        font-size: 32px;
        color: var(--ink-1);
        font-variant-numeric: tabular-nums;
        text-align: right;
        max-width: 60%;
        line-height: 1.3;
      }

      [data-hf="structure-dom"] .mcc-card.is-winner {
        border-color: var(--accent);
        box-shadow: var(--shadow-glow);
      }

      [data-hf="structure-dom"] .mcc-card.is-winner .mcc-head {
        color: var(--bg);
        background: var(--accent);
      }

      [data-hf="structure-dom"] .mcc-card.is-winner .mcc-val {
        color: var(--accent);
      }

      [data-hf="structure-dom"] .mcc-footer {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      [data-hf="structure-dom"] .mcc-divider {
        flex: 1;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7.0" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="mcc-title" data-anim-role="title" data-slot="headline">两种方案的硬指标对比</h2>

            <div class="mcc-cards">
              <div class="mcc-card">
                <div class="mcc-head" data-anim-role="col-header">Baseline</div>
                <div class="mcc-entry">
                  <span class="mcc-dim" data-anim-role="row-label">准确率</span>
                  <span class="mcc-val" data-anim-role="cell">82%</span>
                </div>
                <div class="mcc-entry">
                  <span class="mcc-dim" data-anim-role="row-label">延迟</span>
                  <span class="mcc-val" data-anim-role="cell">120ms</span>
                </div>
                <div class="mcc-entry">
                  <span class="mcc-dim" data-anim-role="row-label">成本</span>
                  <span class="mcc-val" data-anim-role="cell">高</span>
                </div>
              </div>
              <div class="mcc-card is-winner">
                <div class="mcc-head" data-anim-role="col-header">Ours</div>
                <div class="mcc-entry">
                  <span class="mcc-dim" data-anim-role="row-label">准确率</span>
                  <span class="mcc-val" data-anim-role="cell">94%</span>
                </div>
                <div class="mcc-entry">
                  <span class="mcc-dim" data-anim-role="row-label">延迟</span>
                  <span class="mcc-val" data-anim-role="cell">45ms</span>
                </div>
                <div class="mcc-entry">
                  <span class="mcc-dim" data-anim-role="row-label">成本</span>
                  <span class="mcc-val" data-anim-role="cell">低</span>
                </div>
              </div>
            </div>

            <div class="mcc-footer">
              <div class="mcc-divider" data-anim-role="accent-line"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.35" data-duration="1.2" data-track-index="102" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
      <audio id="sfx-1" data-start="0.3" data-duration="0.3" data-track-index="103" src="sfx/tick.mp3" data-volume="0.25"></audio>
      <audio id="sfx-2" data-start="1.4" data-duration="0.6" data-track-index="104" src="sfx/pop.mp3" data-volume="0.3"></audio>
    </div>
    <!-- ===== Structure self-animation (method_comparison_cards) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        var wrap = root.querySelector(".mcc-cards");
        var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
        function parse(raw) {
          if (raw == null) return null;
          if (typeof raw !== "string") return raw;
          try { return JSON.parse(raw); } catch (e) { return null; }
        }
        var columns = parse(V.columns);
        var rows = parse(V.rows);

        if (wrap && Array.isArray(columns) && columns.length >= 1 && Array.isArray(rows) && rows.length >= 1) {
          var m = columns.length;
          var winnerIdx = m - 1;
          wrap.innerHTML = "";
          for (var c = 0; c < m; c++) {
            var card = document.createElement("div");
            card.className = "mcc-card" + (c === winnerIdx ? " is-winner" : "");
            var head = document.createElement("div");
            head.className = "mcc-head";
            head.setAttribute("data-anim-role", "col-header");
            head.textContent = String(columns[c]);
            card.appendChild(head);
            for (var r = 0; r < rows.length; r++) {
              var entry = document.createElement("div");
              entry.className = "mcc-entry";
              var dim = document.createElement("span");
              dim.className = "mcc-dim";
              dim.setAttribute("data-anim-role", "row-label");
              dim.textContent = String(rows[r].dim != null ? rows[r].dim : "");
              var val = document.createElement("span");
              val.className = "mcc-val";
              val.setAttribute("data-anim-role", "cell");
              var vals = Array.isArray(rows[r].values) ? rows[r].values : [];
              val.textContent = (vals[c] != null) ? String(vals[c]) : "—";
              entry.appendChild(dim);
              entry.appendChild(val);
              card.appendChild(entry);
            }
            wrap.appendChild(card);
          }
        }

        var cards = root.querySelectorAll(".mcc-card");
        if (cards.length) {
          tl.from(cards, { y: 40, scale: 0.92, opacity: 0, duration: 0.55, ease: "back.out(1.3)", transformOrigin: "center bottom", stagger: 0.15 }, 0.2);
        }
        var headers = $("col-header");
        if (headers.length) {
          tl.from(headers, { y: -14, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.15 }, 0.35);
        }
        var dims = $("row-label");
        if (dims.length) {
          tl.from(dims, { x: -12, opacity: 0, duration: 0.35, ease: "power2.out", stagger: 0.06 }, 0.6);
        }
        var cells = $("cell");
        if (cells.length) {
          tl.from(cells, { x: 12, opacity: 0, duration: 0.35, ease: "power2.out", stagger: 0.06 }, 0.66);
        }
        var winnerCard = root.querySelector(".mcc-card.is-winner");
        if (winnerCard) {
          tl.to(winnerCard, { scale: 1.04, duration: 0.24, ease: "power2.out", transformOrigin: "center center" }, 1.4);
          tl.to(winnerCard, { scale: 1.0, duration: 0.34, ease: "power2.inOut" }, 1.66);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.4);
        }

        var done = ["col-header", "row-label", "cell", "accent-line"];
        for (var d = 0; d < done.length; d++) {
          var els = $(done[d]);
          for (var i = 0; i < els.length; i++) els[i].removeAttribute("data-anim-role");
        }
      };
    </script>
    <!-- ===== Layer 2: motion (slide_in_hold) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["slide_in_hold"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 24, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.12);
        }
        if ($("title").length) {
          tl.from($("title"), { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 20, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.50);
        }
        if ($("stat").length) {
          tl.from($("stat"), { x: -40, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.40);
        }
        if ($("unit").length) {
          tl.from($("unit"), { x: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.60);
        }
        if ($("card").length) {
          var cards = $("card");
          for (var i = 0; i < cards.length; i++) {
            var xOff = (i % 2 === 0) ? -60 : 60;
            tl.from(cards[i], { x: xOff, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.35 + i * 0.12);
          }
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 14, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 }, 0.70);
        }
        if ($("media").length) {
          tl.from($("media"), { x: 40, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.30);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.75);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: -16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.80);
        }
        if ($("cta").length) {
          tl.from($("cta"), { y: 20, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.85);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 0.55);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["slide_in_hold"]) {
              window.__hf_motions["slide_in_hold"](tl, { gsap: gsap, root: root, duration: 7.0, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
