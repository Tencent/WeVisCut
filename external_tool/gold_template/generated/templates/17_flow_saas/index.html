<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "标题", "default": "药物研发全流程"}, {"id": "nodes", "type": "string", "label": "节点", "default": "[{\"id\": \"n1\", \"label\": \"靶点发现\"}, {\"id\": \"n2\", \"label\": \"先导优化\"}, {\"id\": \"n3\", \"label\": \"临床试验\"}, {\"id\": \"n4\", \"label\": \"上市审批\"}]"}, {"id": "edges", "type": "string", "label": "连接", "default": "[{\"from\": \"n1\", \"to\": \"n2\"}, {\"from\": \"n2\", \"to\": \"n3\"}, {\"from\": \"n3\", \"to\": \"n4\"}]"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== fonts (CJK 必须本地注入；HyperFrames 内置列表为拉丁字体) ===== */
      @font-face{font-family:"Noto Sans SC";font-weight:900;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Black.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Bold.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:500;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Medium.ttf") format("truetype");}
      @font-face{font-family:"Noto Sans SC";font-weight:400;font-style:normal;font-display:block;src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");}
      @font-face{font-family:"Noto Serif SC";font-weight:700;font-style:normal;font-display:block;src:url("fonts/NotoSerifSC-Bold.otf") format("opentype");}
      /* ===== reset ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      /* ===== centered translucent rounded stage panel (geometry fixed here, look from tokens) ===== */
      #scene { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .stage-panel {
        position: relative; overflow: hidden;
        width: calc(100% - 320px); height: calc(100% - 200px);
        background: var(--stage-bg); border-radius: var(--radius-stage);
        box-shadow: var(--shadow-soft);
        -webkit-backdrop-filter: blur(var(--stage-blur, 0px)); backdrop-filter: blur(var(--stage-blur, 0px));
      }
      /* ===== Layer 3: visual tokens (clean_saas) ===== */
      :root {
        --bg: #f7f9fc;
        --bg-2: #eef2f8;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --danger: #ef4444;
        --success: #10b981;
        --line: rgba(15,23,42,.08);
        --line-strong: rgba(15,23,42,.16);
        --font-display: "Noto Sans SC", system-ui, sans-serif;
        --font-body: "Noto Sans SC", system-ui, sans-serif;
        --font-caption: "Noto Sans SC", system-ui, sans-serif;
        --weight-display: 800;
        --weight-body: 500;
        --radius-card: 20px;
        --radius-pill: 999px;
        --shadow-soft: 0 16px 40px rgba(15,23,42,.10);
        --shadow-glow: 0 0 30px rgba(79,70,229,.18);
        --grid-color: rgba(15,23,42,.04);
        --stage-bg: rgba(255,255,255,.5);
        --radius-stage: 40px;
        --stage-blur: 8px;
      }

      .stage {
        font-family: var(--font-body);
        color: var(--ink-1);
        background: var(--bg);
      }

      .bg-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 45%, rgba(79,70,229,.06) 0%, transparent 60%),
          radial-gradient(ellipse 40% 40% at 80% 70%, rgba(14,165,233,.04) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .caption-bar .caption-text {
        font-family: var(--font-caption);
        color: var(--ink-1);
        background: var(--surface);
        border-radius: var(--radius-card);
        padding: 8px 20px;
      }
      /* ===== Layer 1: structure css (flow_steps) ===== */
      [data-hf="structure-dom"] {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 56px 72px 48px;
        gap: 32px;
        box-sizing: border-box;
      }

      [data-hf="structure-dom"] .flow-title {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 60px;
        line-height: 1.2;
        color: var(--ink-1);
        max-width: 900px;
      }

      [data-hf="structure-dom"] .flow-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        min-height: 0;
      }

      [data-hf="structure-dom"] .flow-node {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 180px;
        height: 180px;
        border-radius: var(--radius-card);
        background: var(--surface);
        border: 2px solid var(--line-strong);
        flex-shrink: 0;
      }

      [data-hf="structure-dom"] .flow-node-label {
        font-family: var(--font-body);
        font-weight: var(--weight-display);
        font-size: 28px;
        color: var(--ink-1);
        text-align: center;
        padding: 0 12px;
      }

      [data-hf="structure-dom"] .flow-edge-group {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        width: 80px;
        height: 4px;
        position: relative;
      }

      [data-hf="structure-dom"] .flow-edge-line {
        width: 100%;
        height: 4px;
        background: var(--line-strong);
        transform-origin: left center;
      }

      [data-hf="structure-dom"] .flow-marker {
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%);
      }

      [data-hf="structure-dom"] .flow-marker svg {
        display: block;
      }

      [data-hf="structure-dom"] .flow-accent {
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
    </style>
  </head>
  <body class="stage">
    <div id="root" data-composition-id="root" data-start="0" data-duration="7.5" data-width="1920" data-height="1080">
      <div class="bg-stage" data-anim-role="bg"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7.5" data-track-index="1">
        <div class="stage-panel">
          <div data-hf="structure-dom">
            <h2 class="flow-title" data-anim-role="title" data-slot="headline">数据处理流水线</h2>

            <div class="flow-area">
              <div class="flow-node" data-anim-role="node">
                <span class="flow-node-label" data-anim-role="node-label">采集</span>
              </div>

              <div class="flow-edge-group">
                <div class="flow-edge-line" data-anim-role="edge"></div>
                <span class="flow-marker" data-anim-role="marker">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <polygon points="0,0 14,7 0,14" fill="var(--accent)"/>
                  </svg>
                </span>
              </div>

              <div class="flow-node" data-anim-role="node">
                <span class="flow-node-label" data-anim-role="node-label">清洗</span>
              </div>

              <div class="flow-edge-group">
                <div class="flow-edge-line" data-anim-role="edge"></div>
                <span class="flow-marker" data-anim-role="marker">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <polygon points="0,0 14,7 0,14" fill="var(--accent)"/>
                  </svg>
                </span>
              </div>

              <div class="flow-node" data-anim-role="node">
                <span class="flow-node-label" data-anim-role="node-label">训练</span>
              </div>

              <div class="flow-edge-group">
                <div class="flow-edge-line" data-anim-role="edge"></div>
                <span class="flow-marker" data-anim-role="marker">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <polygon points="0,0 14,7 0,14" fill="var(--accent)"/>
                  </svg>
                </span>
              </div>

              <div class="flow-node" data-anim-role="node">
                <span class="flow-node-label" data-anim-role="node-label">部署</span>
              </div>
            </div>

            <div class="flow-accent" data-anim-role="accent-line"></div>
          </div>
        </div>
      </div>
      <!-- ===== SFX audio tracks ===== -->
      <audio id="sfx-0" data-start="0.3" data-duration="1.2" data-track-index="102" src="sfx/whoosh.mp3" data-volume="0.35"></audio>
    </div>
    <!-- ===== Structure self-animation (flow_steps) ===== -->
    <script>
      window.__hf_structure_init = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
        var nodesRaw = V.nodes || null;
        var edgesRaw = V.edges || null;
        var nodes = null, edges = null;
        try { nodes = typeof nodesRaw === "string" ? JSON.parse(nodesRaw) : nodesRaw; } catch (e) { nodes = null; }
        try { edges = typeof edgesRaw === "string" ? JSON.parse(edgesRaw) : edgesRaw; } catch (e) { edges = null; }

        if (nodes && Array.isArray(nodes) && nodes.length > 0) {
          var flowArea = root.querySelector(".flow-area");
          if (flowArea) {
            flowArea.innerHTML = "";
            for (var i = 0; i < nodes.length; i++) {
              var nodeEl = document.createElement("div"); nodeEl.className = "flow-node";
              nodeEl.setAttribute("data-anim-role", "node");
              var labelEl = document.createElement("span"); labelEl.className = "flow-node-label";
              labelEl.setAttribute("data-anim-role", "node-label");
              labelEl.textContent = nodes[i].label;
              nodeEl.appendChild(labelEl); flowArea.appendChild(nodeEl);
              if (edges && i < nodes.length - 1) {
                var edgeGroup = document.createElement("div"); edgeGroup.className = "flow-edge-group";
                var edgeLine = document.createElement("div"); edgeLine.className = "flow-edge-line";
                edgeLine.setAttribute("data-anim-role", "edge");
                var marker = document.createElement("span"); marker.className = "flow-marker";
                marker.setAttribute("data-anim-role", "marker");
                marker.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polygon points="0,0 14,7 0,14" fill="var(--accent)"/></svg>';
                edgeGroup.appendChild(edgeLine); edgeGroup.appendChild(marker); flowArea.appendChild(edgeGroup);
              }
            }
          }
        }

        var allNodes = $("node"), allEdges = $("edge"), allMarkers = $("marker"), allLabels = $("node-label");
        for (var n = 0; n < allNodes.length; n++) {
          var nodeDelay = 0.3 + n * 0.25;
          tl.from(allNodes[n], { scale: 0, opacity: 0, duration: 0.45, ease: "back.out(1.2)" }, nodeDelay);
          if (n < allLabels.length) {
            tl.from(allLabels[n], { opacity: 0, duration: 0.3, ease: "power2.out" }, nodeDelay + 0.1);
          }
          if (n < allEdges.length) {
            tl.from(allEdges[n], { scaleX: 0, duration: 0.35, ease: "power2.out", transformOrigin: "left center" }, nodeDelay + 0.2);
          }
          if (n < allMarkers.length) {
            tl.from(allMarkers[n], { scale: 0, opacity: 0, duration: 0.25, ease: "back.out(1.4)" }, nodeDelay + 0.45);
          }
        }
      };
    </script>
    <!-- ===== Layer 2: motion (card_stack_sequence) ===== -->
    <script>
      window.__hf_motions = window.__hf_motions || {};
      window.__hf_motions["card_stack_sequence"] = function (tl, ctx) {
        var gsap = ctx.gsap, root = ctx.root;
        var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

        if ($("eyebrow").length) {
          tl.from($("eyebrow"), { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.10);
        }
        if ($("title").length) {
          tl.from($("title"), { y: 30, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        }
        if ($("subtitle").length) {
          tl.from($("subtitle"), { y: 18, opacity: 0, duration: 0.45, ease: "expo.out" }, 0.50);
        }
        if ($("stat").length) {
          tl.from($("stat"), { y: 40, opacity: 0, scale: 0.96, duration: 0.5, ease: "back.out(1.3)" }, 0.50);
        }
        if ($("unit").length) {
          tl.from($("unit"), { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.75);
        }
        if ($("accent-line").length) {
          tl.from($("accent-line"), { scaleX: 0, opacity: 0, duration: 0.7, ease: "expo.out", transformOrigin: "left center" }, 0.30);
        }
        if ($("card").length) {
          tl.from($("card"), { y: 40, opacity: 0, scale: 0.96, duration: 0.5, ease: "back.out(1.3)", stagger: 0.22 }, 0.70);
        }
        if ($("list-item").length) {
          tl.from($("list-item"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out", stagger: 0.18 }, 1.10);
        }
        if ($("media").length) {
          tl.from($("media"), { y: 30, opacity: 0, scale: 0.96, duration: 0.5, ease: "back.out(1.2)" }, 0.55);
        }
        if ($("caption").length) {
          tl.from($("caption"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.20);
        }
        if ($("badge").length) {
          tl.from($("badge"), { y: -12, opacity: 0, duration: 0.35, ease: "power2.out" }, 1.30);
        }
        if ($("cta").length) {
          tl.from($("cta"), { y: 20, opacity: 0, scale: 0.96, duration: 0.45, ease: "back.out(1.2)" }, 1.40);
        }
      };
    </script>
    <script>
            const V = window.__hyperframes.getVariables();
            document.querySelectorAll('[data-slot]').forEach(function (el) {
              const k = el.getAttribute('data-slot');
              if (V[k] !== undefined && V[k] !== null) el.textContent = V[k];
            });
            const root = document.getElementById('root');
            const tl = gsap.timeline({ paused: true });
            if (window.__hf_structure_init) {
              window.__hf_structure_init(tl, { gsap: gsap, root: root, duration: 7.5, isFinal: false });
            }
            if (window.__hf_motions && window.__hf_motions["card_stack_sequence"]) {
              window.__hf_motions["card_stack_sequence"](tl, { gsap: gsap, root: root, duration: 7.5, isFinal: false });
            }
            window.__timelines = window.__timelines || {};
            window.__timelines["root"] = tl;
        
    
    </script>
  </body>
</html>
