<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 56px 80px 48px;
  gap: 18px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .mb-title {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 60px;
  line-height: 1.2;
  color: var(--ink-1);
  text-align: center;
  max-width: 1100px;
}

[data-hf="structure-dom"] .mb-graph {
  position: relative;
  width: 980px;
  height: 600px;
  flex-shrink: 0;
}

[data-hf="structure-dom"] .mb-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

[data-hf="structure-dom"] .mb-node {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .mb-node.center {
  width: 168px;
  height: 168px;
  left: 406px;
  top: 216px;
  border-radius: var(--radius-card);
  background: var(--surface-2);
  border: 3px solid var(--accent);
  box-shadow: var(--shadow-glow);
  z-index: 2;
}

[data-hf="structure-dom"] .mb-node.child {
  width: 128px;
  height: 128px;
  border-radius: var(--radius-card);
  background: var(--surface-2);
  border: 2px solid var(--accent-2);
  z-index: 1;
}

[data-hf="structure-dom"] .mb-node-label {
  font-family: var(--font-body);
  font-weight: var(--weight-display);
  font-size: 25px;
  color: var(--ink-1);
  text-align: center;
  padding: 0 8px;
  line-height: 1.2;
}

[data-hf="structure-dom"] .mb-node.center .mb-node-label {
  font-size: 34px;
  color: var(--ink-1);
}

[data-hf="structure-dom"] .mb-edge {
  stroke: var(--line-strong);
  stroke-width: 3;
  fill: none;
}
</style>

<div data-hf="structure-dom">
  <h2 class="mb-title" data-anim-role="title" data-slot="headline">一个 Agent 的核心模块</h2>
  <div class="mb-graph">
    <svg class="mb-edges" viewBox="0 0 980 600" preserveAspectRatio="none">
      <polyline class="mb-edge" data-anim-role="edge" points="490,300 490,90 490,90"></polyline>
      <polyline class="mb-edge" data-anim-role="edge" points="490,300 490,90 830,90"></polyline>
      <polyline class="mb-edge" data-anim-role="edge" points="490,300 490,300 830,300"></polyline>
      <polyline class="mb-edge" data-anim-role="edge" points="490,300 490,510 830,510"></polyline>
      <polyline class="mb-edge" data-anim-role="edge" points="490,300 490,510 490,510"></polyline>
    </svg>
    <div class="mb-node center" data-anim-role="node">
      <span class="mb-node-label" data-slot="center_label">Agent</span>
    </div>
    <div class="mb-node child" style="left: 426px; top: 26px;" data-anim-role="node">
      <span class="mb-node-label" data-anim-role="node-label">感知</span>
    </div>
    <div class="mb-node child" style="left: 766px; top: 26px;" data-anim-role="node">
      <span class="mb-node-label" data-anim-role="node-label">记忆</span>
    </div>
    <div class="mb-node child" style="left: 766px; top: 236px;" data-anim-role="node">
      <span class="mb-node-label" data-anim-role="node-label">规划</span>
    </div>
    <div class="mb-node child" style="left: 766px; top: 446px;" data-anim-role="node">
      <span class="mb-node-label" data-anim-role="node-label">执行</span>
    </div>
    <div class="mb-node child" style="left: 426px; top: 446px;" data-anim-role="node">
      <span class="mb-node-label" data-anim-role="node-label">反思</span>
    </div>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };
  var SVGNS = "http://www.w3.org/2000/svg";

  var graph = root.querySelector(".mb-graph");
  var svg = root.querySelector(".mb-edges");
  var cx = 490, cy = 300, childR = 64;
  var slots = [[490,90],[830,90],[830,300],[830,510],[490,510],[150,510],[150,300],[150,90]];

  var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  var raw = V.modules || null;
  var modules = null;
  try { modules = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { modules = null; }

  if (modules && Array.isArray(modules) && modules.length > 0 && graph && svg) {
    var oldChildren = graph.querySelectorAll(".mb-node.child");
    for (var c = 0; c < oldChildren.length; c++) { oldChildren[c].parentNode.removeChild(oldChildren[c]); }
    while (svg.firstChild) { svg.removeChild(svg.firstChild); }

    var n = Math.min(modules.length, slots.length);
    for (var i = 0; i < n; i++) {
      var sx = slots[i][0], sy = slots[i][1];
      var poly = document.createElementNS(SVGNS, "polyline");
      poly.setAttribute("class", "mb-edge");
      poly.setAttribute("data-anim-role", "edge");
      poly.setAttribute("points", cx + "," + cy + " " + cx + "," + sy + " " + sx + "," + sy);
      svg.appendChild(poly);

      var node = document.createElement("div");
      node.className = "mb-node child";
      node.setAttribute("data-anim-role", "node");
      node.style.left = (sx - childR) + "px";
      node.style.top = (sy - childR) + "px";
      var label = document.createElement("span");
      label.className = "mb-node-label";
      label.setAttribute("data-anim-role", "node-label");
      label.textContent = modules[i].label || "";
      node.appendChild(label);
      graph.appendChild(node);
    }
  }

  var centerNode = root.querySelector(".mb-node.center");
  if (centerNode) {
    tl.from(centerNode, { scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(1.5)", transformOrigin: "center center" }, 0.1);
  }

  var edges = $("edge");
  for (var e = 0; e < edges.length; e++) {
    var poly2 = edges[e];
    var len = poly2.getTotalLength ? poly2.getTotalLength() : 600;
    poly2.style.strokeDasharray = len;
    poly2.style.strokeDashoffset = 0;
    tl.from(poly2, { strokeDashoffset: len, duration: 0.45, ease: "power2.out" }, 0.35 + e * 0.08);
  }

  var children = root.querySelectorAll(".mb-node.child");
  for (var k = 0; k < children.length; k++) {
    tl.from(children[k], { scale: 0.4, opacity: 0, duration: 0.4, ease: "back.out(1.4)", transformOrigin: "center center" }, 0.55 + k * 0.08);
  }

  var labels = $("node-label");
  if (labels.length) {
    tl.from(labels, { opacity: 0, y: 8, duration: 0.3, ease: "power2.out", stagger: 0.06 }, 0.75);
  }

  ["node", "edge", "node-label", "marker"].forEach(function (r) {
    var els = root.querySelectorAll('[data-anim-role="' + r + '"]');
    for (var m = 0; m < els.length; m++) { els[m].removeAttribute("data-anim-role"); }
  });
};
</script>
