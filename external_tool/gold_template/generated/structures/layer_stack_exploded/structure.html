<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 64px 90px;
  gap: 22px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .ls-title {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 60px;
  line-height: 1.2;
  color: var(--ink-1);
  text-align: center;
  max-width: 1100px;
}

[data-hf="structure-dom"] .ls-line {
  width: 96px;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

[data-hf="structure-dom"] .ls-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  justify-content: center;
  min-height: 0;
  gap: 40px;
  position: relative;
}

[data-hf="structure-dom"] .ls-guide {
  position: absolute;
  top: 6%;
  bottom: 6%;
  left: 50%;
  width: 0;
  border-left: 2px dashed var(--line-strong);
  transform: translateX(-50%);
}

[data-hf="structure-dom"] .ls-layer {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 22px;
  width: 720px;
  height: 96px;
  padding: 0 30px;
  border-radius: var(--radius-card);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-soft);
}

[data-hf="structure-dom"] .ls-layer.l1 { background: var(--surface-2); border-color: var(--accent); box-shadow: var(--shadow-glow); }

[data-hf="structure-dom"] .ls-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  flex-shrink: 0;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  color: var(--accent);
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 26px;
  letter-spacing: 0.04em;
}

[data-hf="structure-dom"] .ls-layer.l1 .ls-tag { color: var(--accent); background: var(--surface); border-color: var(--accent); }

[data-hf="structure-dom"] .ls-label {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 30px;
  line-height: 1.3;
  color: var(--ink-1);
}

[data-hf="structure-dom"] .ls-layer.l1 .ls-label { color: var(--ink-1); }
[data-hf="structure-dom"] .ls-layer.l3 .ls-label { color: var(--ink-2); }
</style>

<div data-hf="structure-dom">
  <h2 class="ls-title" data-anim-role="title" data-slot="headline">系统的三层结构</h2>
  <div class="ls-line" data-anim-role="accent-line"></div>
  <div class="ls-stack">
    <div class="ls-guide"></div>
    <div class="ls-layer l1" data-anim-role="card">
      <span class="ls-tag">L1</span>
      <span class="ls-label" data-slot="layer1">应用层 · 面向用户的交互</span>
    </div>
    <div class="ls-layer l2" data-anim-role="card">
      <span class="ls-tag">L2</span>
      <span class="ls-label" data-slot="layer2">模型层 · 推理与决策</span>
    </div>
    <div class="ls-layer l3" data-anim-role="card">
      <span class="ls-tag">L3</span>
      <span class="ls-label" data-slot="layer3">数据层 · 存储与检索</span>
    </div>
  </div>
</div>
