<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: grid;
  grid-template-columns: 1fr 2fr;
  grid-template-rows: 1fr auto;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 80px 100px;
  gap: 40px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .stage-panel {
  width: 100%;
  height: 100%;
  border-radius: 0;
  background: transparent;
}

[data-hf="structure-dom"] .left-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  grid-row: 1 / 2;
  grid-column: 1 / 2;
}

[data-hf="structure-dom"] .right-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 16px;
  grid-row: 1 / 2;
  grid-column: 2 / 3;
}

[data-hf="structure-dom"] .bottom-row {
  grid-column: 1 / -1;
  grid-row: 2 / 3;
  text-align: center;
}

[data-hf="structure-dom"] .eyebrow-pill {
  display: inline-flex;
  align-items: center;
  padding: 9px 30px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  font-family: var(--font-caption);
  font-weight: var(--weight-body);
  font-size: 22px;
  color: var(--ink-2);
  letter-spacing: 0.1em;
}

[data-hf="structure-dom"] .emoji-hero {
  font-size: 160px;
  line-height: 1;
}

[data-hf="structure-dom"] .question-text {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 80px;
  line-height: 1.2;
  color: var(--ink-1);
  max-width: 900px;
}

[data-hf="structure-dom"] .answer-hint {
  font-family: var(--font-body);
  font-weight: var(--weight-body);
  font-size: 42px;
  line-height: 1.5;
  color: var(--ink-2);
  opacity: 0;
  filter: blur(10px);
}
</style>

<div data-hf="structure-dom">
  <div class="left-col">
    <div class="emoji-hero" data-anim-role="decoration">❓</div>
    <div class="eyebrow-pill" data-anim-role="eyebrow" data-slot="eyebrow">你知道吗</div>
  </div>
  <div class="right-col">
    <h1 class="question-text" data-anim-role="title" data-slot="question_text">人一生心跳约 25 亿次</h1>
  </div>
  <div class="bottom-row">
    <p class="answer-hint" data-anim-role="body" data-slot="answer_hint">平均每分钟 72 次，日夜不停跳动 80 年</p>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

  if ($("decoration").length) {
    tl.from($("decoration"), { scale: 0, rotation: -180, opacity: 0, duration: 0.7, ease: "back.out(1.7)" }, 0.1);
  }

  if ($("eyebrow").length) {
    tl.from($("eyebrow"), { y: -16, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.3);
  }

  if ($("title").length) {
    tl.from($("title"), { x: 40, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.5);
  }

  if ($("body").length) {
    tl.to($("body"), { opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power2.out" }, 2.5);
  }

  var roles = ["decoration", "eyebrow", "title", "body"];
  for (var r = 0; r < roles.length; r++) {
    var els = $(roles[r]);
    for (var i = 0; i < els.length; i++) els[i].removeAttribute("data-anim-role");
  }
};
</script>
