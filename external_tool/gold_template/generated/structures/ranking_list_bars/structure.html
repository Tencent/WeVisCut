<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  height: 100%;
  padding: 64px 100px;
  gap: 28px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .eyebrow-pill {
  display: inline-flex;
  align-items: center;
  padding: 8px 28px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  font-family: var(--font-caption);
  font-weight: var(--weight-body);
  font-size: 22px;
  color: var(--ink-2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

[data-hf="structure-dom"] .rl-headline {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 52px;
  line-height: 1.15;
  color: var(--ink-1);
  text-align: center;
}

[data-hf="structure-dom"] .rl-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 85%;
  flex: 1;
  min-height: 0;
  justify-content: center;
}

[data-hf="structure-dom"] .rl-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

[data-hf="structure-dom"] .rl-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 200px;
}

[data-hf="structure-dom"] .rl-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 18px;
  flex-shrink: 0;
}

[data-hf="structure-dom"] .rl-emoji {
  font-size: 24px;
  flex-shrink: 0;
}

[data-hf="structure-dom"] .rl-label {
  font-family: var(--font-body);
  font-weight: var(--weight-body);
  font-size: 22px;
  color: var(--ink-1);
}

[data-hf="structure-dom"] .rl-bar-track {
  flex: 1;
  height: 28px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  overflow: hidden;
  position: relative;
}

[data-hf="structure-dom"] .rl-bar-fill {
  height: 100%;
  border-radius: 14px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 12px;
}

[data-hf="structure-dom"] .rl-bar-value {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 14px;
  color: var(--bg);
}
</style>

<div data-hf="structure-dom">
  <div class="eyebrow-pill" data-anim-role="eyebrow" data-slot="eyebrow">Top 5</div>
  <h1 class="rl-headline" data-anim-role="title" data-slot="headline">全球最深的五个海沟</h1>
  <div class="rl-container">
    <div class="rl-item" data-anim-role="list-item">
      <div class="rl-meta">
        <span class="rl-badge">1</span>
        <span class="rl-emoji">🌊</span>
        <span class="rl-label">马里亚纳海沟</span>
      </div>
      <div class="rl-bar-track"><div class="rl-bar-fill" style="width:100%"><span class="rl-bar-value">10994m</span></div></div>
    </div>
    <div class="rl-item" data-anim-role="list-item">
      <div class="rl-meta">
        <span class="rl-badge">2</span>
        <span class="rl-emoji">🌊</span>
        <span class="rl-label">汤加海沟</span>
      </div>
      <div class="rl-bar-track"><div class="rl-bar-fill" style="width:99%"><span class="rl-bar-value">10882m</span></div></div>
    </div>
    <div class="rl-item" data-anim-role="list-item">
      <div class="rl-meta">
        <span class="rl-badge">3</span>
        <span class="rl-emoji">🌊</span>
        <span class="rl-label">千岛海沟</span>
      </div>
      <div class="rl-bar-track"><div class="rl-bar-fill" style="width:96%"><span class="rl-bar-value">10542m</span></div></div>
    </div>
    <div class="rl-item" data-anim-role="list-item">
      <div class="rl-meta">
        <span class="rl-badge">4</span>
        <span class="rl-emoji">🌊</span>
        <span class="rl-label">菲律宾海沟</span>
      </div>
      <div class="rl-bar-track"><div class="rl-bar-fill" style="width:96%"><span class="rl-bar-value">10540m</span></div></div>
    </div>
    <div class="rl-item" data-anim-role="list-item">
      <div class="rl-meta">
        <span class="rl-badge">5</span>
        <span class="rl-emoji">🌊</span>
        <span class="rl-label">克马德克海沟</span>
      </div>
      <div class="rl-bar-track"><div class="rl-bar-fill" style="width:91%"><span class="rl-bar-value">10047m</span></div></div>
    </div>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var items = root.querySelectorAll('.rl-item');
  var count = items.length;

  for (var i = 0; i < count; i++) {
    var idx = count - 1 - i;
    var item = items[idx];
    var barFill = item.querySelector('.rl-bar-fill');
    var meta = item.querySelector('.rl-meta');
    var offset = i * 1.2;

    tl.from(meta, { x: -30, opacity: 0, duration: 0.4, ease: "power2.out" }, offset);
    if (barFill) {
      tl.from(barFill, { width: 0, duration: 0.6, ease: "power2.out" }, offset + 0.2);
    }
  }

  var allEls = root.querySelectorAll('[data-anim-role]');
  for (var i = 0; i < allEls.length; i++) allEls[i].removeAttribute('data-anim-role');
};
</script>
