<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 48px 80px 44px;
  gap: 16px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .bfr-title {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 60px;
  line-height: 1.2;
  color: var(--ink-1);
  max-width: 1100px;
  text-align: center;
  align-self: center;
}

[data-hf="structure-dom"] .bfr-area {
  flex: 1;
  position: relative;
  min-height: 0;
}

[data-hf="structure-dom"] .bfr-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

[data-hf="structure-dom"] .bfr-edge {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 3;
  stroke-linecap: round;
}

[data-hf="structure-dom"] .bfr-root {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 26%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 30px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 3px solid var(--accent);
  box-shadow: var(--shadow-glow);
}

[data-hf="structure-dom"] .bfr-root-label {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 32px;
  line-height: 1.25;
  color: var(--ink-1);
}

[data-hf="structure-dom"] .bfr-branch {
  position: absolute;
  transform: translate(-50%, -50%);
  max-width: 22%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 2px solid var(--line-strong);
  box-shadow: var(--shadow-soft);
}

[data-hf="structure-dom"] .bfr-dot {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  border-radius: var(--radius-pill);
  background: var(--accent-2);
}

[data-hf="structure-dom"] .bfr-branch-label {
  font-family: var(--font-body);
  font-weight: var(--weight-display);
  font-size: 24px;
  line-height: 1.2;
  color: var(--ink-1);
  white-space: nowrap;
}
</style>

<div data-hf="structure-dom">
  <h2 class="bfr-title" data-anim-role="title" data-slot="headline">一个底座，三种能力</h2>

  <div class="bfr-area">
    <svg class="bfr-edges" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path class="bfr-edge" data-anim-role="edge" pathLength="1" vector-effect="non-scaling-stroke" d="M50 50 L 50 17"></path>
      <path class="bfr-edge" data-anim-role="edge" pathLength="1" vector-effect="non-scaling-stroke" d="M50 50 L 78.6 66.5"></path>
      <path class="bfr-edge" data-anim-role="edge" pathLength="1" vector-effect="non-scaling-stroke" d="M50 50 L 21.4 66.5"></path>
    </svg>

    <div class="bfr-root" data-anim-role="node">
      <span class="bfr-root-label" data-anim-role="node-label" data-slot="root_label">统一大模型</span>
    </div>

    <div class="bfr-branch" data-anim-role="node" style="left: 50%; top: 17%">
      <span class="bfr-dot" data-anim-role="marker"></span>
      <span class="bfr-branch-label" data-anim-role="node-label">文本理解</span>
    </div>
    <div class="bfr-branch" data-anim-role="node" style="left: 78.6%; top: 66.5%">
      <span class="bfr-dot" data-anim-role="marker"></span>
      <span class="bfr-branch-label" data-anim-role="node-label">图像识别</span>
    </div>
    <div class="bfr-branch" data-anim-role="node" style="left: 21.4%; top: 66.5%">
      <span class="bfr-dot" data-anim-role="marker"></span>
      <span class="bfr-branch-label" data-anim-role="node-label">语音交互</span>
    </div>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };
  var SVGNS = "http://www.w3.org/2000/svg";

  var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  var raw = V.branches || null;
  var branches = null;
  try { branches = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { branches = null; }

  var area = root.querySelector(".bfr-area");
  var svg = root.querySelector(".bfr-edges");
  var RX = 32, RY = 33, CX = 50, CY = 50;
  function ptFor(i, n) {
    var ang = (-90 + i * (360 / n)) * Math.PI / 180;
    return { x: CX + RX * Math.cos(ang), y: CY + RY * Math.sin(ang) };
  }

  if (branches && Array.isArray(branches) && branches.length > 0 && area && svg) {
    var olds = area.querySelectorAll(".bfr-branch");
    for (var o = 0; o < olds.length; o++) olds[o].parentNode.removeChild(olds[o]);
    svg.innerHTML = "";
    var n = branches.length;
    for (var i = 0; i < n; i++) {
      var p = ptFor(i, n);
      var path = document.createElementNS(SVGNS, "path");
      path.setAttribute("class", "bfr-edge");
      path.setAttribute("data-anim-role", "edge");
      path.setAttribute("pathLength", "1");
      path.setAttribute("vector-effect", "non-scaling-stroke");
      path.setAttribute("d", "M50 50 L " + p.x.toFixed(2) + " " + p.y.toFixed(2));
      svg.appendChild(path);

      var node = document.createElement("div");
      node.className = "bfr-branch";
      node.setAttribute("data-anim-role", "node");
      node.style.left = p.x.toFixed(2) + "%";
      node.style.top = p.y.toFixed(2) + "%";
      var dot = document.createElement("span");
      dot.className = "bfr-dot";
      dot.setAttribute("data-anim-role", "marker");
      var label = document.createElement("span");
      label.className = "bfr-branch-label";
      label.setAttribute("data-anim-role", "node-label");
      label.textContent = branches[i].label != null ? branches[i].label : "";
      node.appendChild(dot);
      node.appendChild(label);
      area.appendChild(node);
    }
  }

  var rootNode = root.querySelector(".bfr-root");
  if (rootNode) {
    tl.from(rootNode, { scale: 0.8, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.1);
  }

  var edges = root.querySelectorAll(".bfr-edge");
  var branchNodes = root.querySelectorAll(".bfr-branch");
  for (var b = 0; b < branchNodes.length; b++) {
    var t = 0.55 + b * 0.14;
    if (b < edges.length) {
      gsap.set(edges[b], { strokeDasharray: 1 });
      tl.from(edges[b], { strokeDashoffset: 1, duration: 0.45, ease: "power2.out" }, t);
    }
    var nodeLabel = branchNodes[b].querySelector(".bfr-branch-label");
    var nodeDot = branchNodes[b].querySelector(".bfr-dot");
    tl.from(branchNodes[b], { scale: 0.7, opacity: 0, duration: 0.4, ease: "back.out(1.6)" }, t + 0.3);
    if (nodeDot) tl.from(nodeDot, { scale: 0, opacity: 0, duration: 0.25, ease: "back.out(1.6)" }, t + 0.32);
    if (nodeLabel) tl.from(nodeLabel, { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.4);
  }

  function strip(role) { var els = $(role); for (var k = 0; k < els.length; k++) els[k].removeAttribute("data-anim-role"); }
  strip("node"); strip("edge"); strip("node-label"); strip("marker");
};
</script>
