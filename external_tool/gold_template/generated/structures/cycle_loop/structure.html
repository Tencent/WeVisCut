<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 48px 64px 44px;
  gap: 24px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .cycle-title {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 56px;
  line-height: 1.2;
  color: var(--ink-1);
  text-align: center;
  max-width: 900px;
}

[data-hf="structure-dom"] .cycle-diagram {
  flex: 1;
  position: relative;
  width: 480px;
  max-width: 100%;
  aspect-ratio: 1;
  min-height: 0;
}

[data-hf="structure-dom"] .cycle-ring {
  position: absolute;
  inset: 0;
}

[data-hf="structure-dom"] .cycle-ring svg {
  width: 100%;
  height: 100%;
}

[data-hf="structure-dom"] .cycle-node {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--line-strong);
  transform: translate(-50%, -50%);
}

[data-hf="structure-dom"] .cycle-node:nth-child(1) { top: 2%; left: 50%; }
[data-hf="structure-dom"] .cycle-node:nth-child(2) { top: 50%; left: 98%; }
[data-hf="structure-dom"] .cycle-node:nth-child(3) { top: 98%; left: 50%; }
[data-hf="structure-dom"] .cycle-node:nth-child(4) { top: 50%; left: 2%; }

[data-hf="structure-dom"] .cycle-node-label {
  font-family: var(--font-body);
  font-weight: var(--weight-display);
  font-size: 24px;
  color: var(--ink-1);
  text-align: center;
  padding: 0 8px;
}

[data-hf="structure-dom"] .cycle-note {
  font-family: var(--font-caption);
  font-weight: var(--weight-body);
  font-size: 22px;
  color: var(--ink-2);
  text-align: center;
  max-width: 600px;
}
</style>

<div data-hf="structure-dom">
  <h2 class="cycle-title" data-anim-role="title" data-slot="headline">水循环过程</h2>

  <div class="cycle-diagram">
    <div class="cycle-ring">
      <svg viewBox="0 0 480 480" fill="none">
        <path data-anim-role="edge" d="M240,25 A215,215 0 0,1 455,240" stroke="var(--line-strong)" stroke-width="3" fill="none" stroke-dasharray="338" stroke-dashoffset="0"/>
        <polygon data-anim-role="marker" points="455,230 455,250 468,240" fill="var(--accent)"/>

        <path data-anim-role="edge" d="M455,240 A215,215 0 0,1 240,455" stroke="var(--line-strong)" stroke-width="3" fill="none" stroke-dasharray="338" stroke-dashoffset="0"/>
        <polygon data-anim-role="marker" points="250,455 230,455 240,468" fill="var(--accent)"/>

        <path data-anim-role="edge" d="M240,455 A215,215 0 0,1 25,240" stroke="var(--line-strong)" stroke-width="3" fill="none" stroke-dasharray="338" stroke-dashoffset="0"/>
        <polygon data-anim-role="marker" points="25,250 25,230 12,240" fill="var(--accent)"/>

        <path data-anim-role="edge" d="M25,240 A215,215 0 0,1 240,25" stroke="var(--line-strong)" stroke-width="3" fill="none" stroke-dasharray="338" stroke-dashoffset="0"/>
        <polygon data-anim-role="marker" points="230,25 250,25 240,12" fill="var(--accent)"/>
      </svg>
    </div>

    <div class="cycle-node" data-anim-role="node">
      <span class="cycle-node-label" data-anim-role="node-label">蒸发</span>
    </div>
    <div class="cycle-node" data-anim-role="node">
      <span class="cycle-node-label" data-anim-role="node-label">成云</span>
    </div>
    <div class="cycle-node" data-anim-role="node">
      <span class="cycle-node-label" data-anim-role="node-label">降水</span>
    </div>
    <div class="cycle-node" data-anim-role="node">
      <span class="cycle-node-label" data-anim-role="node-label">汇流</span>
    </div>
  </div>

  <p class="cycle-note" data-slot="loop_note">自然界最基本的物质循环</p>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

  if ($("title").length) {
    tl.from($("title"), { y: -20, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.1);
  }
  var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  var nodesRaw = V.nodes || null;
  var nodes = null;
  try { nodes = typeof nodesRaw === "string" ? JSON.parse(nodesRaw) : nodesRaw; } catch (e) { nodes = null; }

  if (nodes && Array.isArray(nodes) && nodes.length > 0) {
    var diagram = root.querySelector(".cycle-diagram");
    if (diagram) {
      var existingNodes = diagram.querySelectorAll(".cycle-node");
      for (var r = existingNodes.length - 1; r >= 0; r--) existingNodes[r].parentNode.removeChild(existingNodes[r]);
      var count = nodes.length;
      for (var i = 0; i < count; i++) {
        var angle = (i / count) * 2 * Math.PI - Math.PI / 2;
        var cx = 50 + 48 * Math.cos(angle), cy = 50 + 48 * Math.sin(angle);
        var nodeEl = document.createElement("div"); nodeEl.className = "cycle-node";
        nodeEl.setAttribute("data-anim-role", "node");
        nodeEl.style.top = cy + "%"; nodeEl.style.left = cx + "%";
        var labelEl = document.createElement("span"); labelEl.className = "cycle-node-label";
        labelEl.setAttribute("data-anim-role", "node-label");
        labelEl.textContent = nodes[i].label;
        nodeEl.appendChild(labelEl); diagram.appendChild(nodeEl);
      }
      var ring = diagram.querySelector(".cycle-ring");
      if (ring) {
        var svgStr = '<svg viewBox="0 0 480 480" fill="none">';
        var radius = 215, svgCx = 240, svgCy = 240;
        for (var j = 0; j < count; j++) {
          var a1 = (j / count) * 2 * Math.PI - Math.PI / 2;
          var a2 = ((j + 1) / count) * 2 * Math.PI - Math.PI / 2;
          var x1 = svgCx + radius * Math.cos(a1), y1 = svgCy + radius * Math.sin(a1);
          var x2 = svgCx + radius * Math.cos(a2), y2 = svgCy + radius * Math.sin(a2);
          svgStr += '<path data-anim-role="edge" d="M' + x1 + ',' + y1 + ' A' + radius + ',' + radius + ' 0 0,1 ' + x2 + ',' + y2 + '" stroke="var(--line-strong)" stroke-width="3" fill="none"/>';
          var aw = 8;
          var px = x2 + aw * Math.cos(a2 + 2.6), py = y2 + aw * Math.sin(a2 + 2.6);
          var qx = x2 + aw * Math.cos(a2 - 2.6), qy = y2 + aw * Math.sin(a2 - 2.6);
          svgStr += '<polygon data-anim-role="marker" points="' + x2 + ',' + y2 + ' ' + px + ',' + py + ' ' + qx + ',' + qy + '" fill="var(--accent)"/>';
        }
        svgStr += '</svg>';
        ring.innerHTML = svgStr;
      }
    }
  }

  var allNodes = $("node"), allLabels = $("node-label");
  if (allNodes.length) {
    tl.from(allNodes, { scale: 0, opacity: 0, rotation: -8, duration: 0.45, ease: "back.out(1.2)", stagger: 0.2 }, 0.3);
  }
  if (allLabels.length) {
    tl.from(allLabels, { opacity: 0, duration: 0.3, ease: "power2.out", stagger: 0.2 }, 0.45);
  }
  var allEdges = $("edge");
  if (allEdges.length) {
    for (var e = 0; e < allEdges.length; e++) {
      var edgeEl = allEdges[e];
      if (edgeEl.tagName && edgeEl.tagName.toLowerCase() === "path") {
        var pathLen = edgeEl.getTotalLength ? edgeEl.getTotalLength() : 338;
        gsap.set(edgeEl, { strokeDasharray: pathLen, strokeDashoffset: pathLen });
        tl.to(edgeEl, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.5 + e * 0.18);
      }
    }
  }
  var allMarkers = $("marker");
  if (allMarkers.length) {
    tl.from(allMarkers, { scale: 0, opacity: 0, duration: 0.2, ease: "back.out(1.4)", stagger: 0.18 }, 0.85);
  }
};
</script>
