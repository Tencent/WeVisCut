<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 60px 80px;
  gap: 24px;
  box-sizing: border-box;
  text-align: center;
}

[data-hf="structure-dom"] .eyebrow-pill {
  display: inline-flex;
  align-items: center;
  padding: 8px 28px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  font-family: var(--font-caption);
  font-weight: var(--weight-body);
  font-size: 22px;
  color: var(--ink-2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

[data-hf="structure-dom"] .mb-split-row {
  display: flex;
  align-items: stretch;
  gap: 0;
  width: 100%;
  flex: 1;
  min-height: 0;
}

[data-hf="structure-dom"] .mb-panel-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 36px;
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  border-radius: var(--radius-card) 0 0 var(--radius-card);
}

[data-hf="structure-dom"] .mb-panel-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 36px;
  background: color-mix(in srgb, var(--success) 8%, transparent);
  border-radius: 0 var(--radius-card) var(--radius-card) 0;
}

[data-hf="structure-dom"] .mb-icon {
  font-size: 84px;
  line-height: 1;
  flex-shrink: 0;
}

[data-hf="structure-dom"] .mb-icon-wrong {
  color: var(--danger);
}

[data-hf="structure-dom"] .mb-icon-right {
  color: var(--success);
}

[data-hf="structure-dom"] .mb-text {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 48px;
  line-height: 1.25;
  color: var(--ink-1);
  max-width: 500px;
}
</style>

<div data-hf="structure-dom">
  <div class="eyebrow-pill" data-anim-role="eyebrow" data-slot="eyebrow">误区纠正</div>
  <div class="mb-split-row">
    <div class="mb-panel-left">
      <span class="mb-icon mb-icon-wrong" data-anim-role="decoration">✗</span>
      <p class="mb-text" data-anim-role="title" data-slot="wrong_text">人类只使用了大脑的10%</p>
    </div>
    <div class="mb-panel-right">
      <span class="mb-icon mb-icon-right" data-anim-role="decoration">✓</span>
      <p class="mb-text" data-anim-role="body" data-slot="right_text">大脑各区域全天候都在活动</p>
    </div>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var leftPanel = root.querySelector('.mb-panel-left');
  var rightPanel = root.querySelector('.mb-panel-right');
  var leftIcon = leftPanel.querySelector('.mb-icon');
  var leftText = leftPanel.querySelector('.mb-text');
  var rightIcon = rightPanel.querySelector('.mb-icon');
  var rightText = rightPanel.querySelector('.mb-text');

  tl.from(leftPanel, { x: "-100%", opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
  tl.from(leftIcon, { scale: 0, duration: 0.4, ease: "back.out(1.7)" }, 0.4);
  tl.from(leftText, { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 0.6);

  tl.from(rightPanel, { x: "100%", opacity: 0, duration: 0.6, ease: "power2.out" }, 1.5);
  tl.from(rightIcon, { scale: 0, duration: 0.4, ease: "back.out(1.7)" }, 1.9);
  tl.from(rightText, { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 2.1);

  var allEls = root.querySelectorAll('[data-anim-role]');
  for (var i = 0; i < allEls.length; i++) allEls[i].removeAttribute('data-anim-role');
};
</script>
