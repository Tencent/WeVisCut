<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 56px 72px 48px;
  gap: 32px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .ce-eyebrow {
  font-family: var(--font-body);
  font-weight: var(--weight-body);
  font-size: 26px;
  color: var(--accent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

[data-hf="structure-dom"] .ce-headline {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 56px;
  line-height: 1.2;
  color: var(--ink-1);
  max-width: 900px;
}

[data-hf="structure-dom"] .ce-container {
  flex: 1;
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  align-items: center;
  gap: 20px;
  min-height: 0;
}

[data-hf="structure-dom"] .ce-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0.3;
  flex-shrink: 0;
}

[data-hf="structure-dom"] .ce-emoji {
  font-size: 52px;
  line-height: 1;
}

[data-hf="structure-dom"] .ce-label {
  font-family: var(--font-body);
  font-weight: var(--weight-body);
  font-size: 24px;
  color: var(--ink-2);
  max-width: 140px;
  text-align: center;
  line-height: 1.3;
}

[data-hf="structure-dom"] .ce-arrow {
  display: flex;
  align-items: center;
  opacity: 0.3;
  flex-shrink: 0;
}

[data-hf="structure-dom"] .ce-arrow svg {
  display: block;
}

[data-hf="structure-dom"] .stage-panel {
  position: absolute;
  inset: 0;
  background: var(--panel);
  border-radius: var(--radius-card);
  z-index: -1;
}
</style>

<div data-hf="structure-dom">
  <div class="stage-panel" data-anim-role="panel"></div>

  <span class="ce-eyebrow" data-anim-role="eyebrow" data-slot="eyebrow">因果链</span>
  <h2 class="ce-headline" data-anim-role="title" data-slot="headline">全球变暖的多米诺效应</h2>

  <div class="ce-container">
    <div class="ce-node" data-anim-role="list-item">
      <span class="ce-emoji" data-anim-role="decoration">🏭</span>
      <span class="ce-label">温室气体增加</span>
    </div>

    <div class="ce-arrow" data-anim-role="accent-line">
      <svg width="48" height="24" viewBox="0 0 48 24" fill="none">
        <line x1="0" y1="12" x2="36" y2="12" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <polygon points="36,4 48,12 36,20" fill="var(--accent)"/>
      </svg>
    </div>

    <div class="ce-node" data-anim-role="list-item">
      <span class="ce-emoji" data-anim-role="decoration">🌡️</span>
      <span class="ce-label">全球变暖</span>
    </div>

    <div class="ce-arrow" data-anim-role="accent-line">
      <svg width="48" height="24" viewBox="0 0 48 24" fill="none">
        <line x1="0" y1="12" x2="36" y2="12" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <polygon points="36,4 48,12 36,20" fill="var(--accent)"/>
      </svg>
    </div>

    <div class="ce-node" data-anim-role="list-item">
      <span class="ce-emoji" data-anim-role="decoration">🧊</span>
      <span class="ce-label">冰川融化</span>
    </div>

    <div class="ce-arrow" data-anim-role="accent-line">
      <svg width="48" height="24" viewBox="0 0 48 24" fill="none">
        <line x1="0" y1="12" x2="36" y2="12" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <polygon points="36,4 48,12 36,20" fill="var(--accent)"/>
      </svg>
    </div>

    <div class="ce-node" data-anim-role="list-item">
      <span class="ce-emoji" data-anim-role="decoration">🌊</span>
      <span class="ce-label">海平面上升</span>
    </div>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

  var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  var nodesRaw = V.nodes || null;
  var nodesData = null;
  try { nodesData = typeof nodesRaw === "string" ? JSON.parse(nodesRaw) : nodesRaw; } catch (e) { nodesData = null; }

  if (nodesData && Array.isArray(nodesData) && nodesData.length > 0) {
    var container = root.querySelector(".ce-container");
    if (container) {
      container.innerHTML = "";
      for (var i = 0; i < nodesData.length; i++) {
        var nodeEl = document.createElement("div");
        nodeEl.className = "ce-node";
        nodeEl.setAttribute("data-anim-role", "list-item");

        var emojiEl = document.createElement("span");
        emojiEl.className = "ce-emoji";
        emojiEl.setAttribute("data-anim-role", "decoration");
        emojiEl.textContent = nodesData[i].emoji || "🔗";
        nodeEl.appendChild(emojiEl);

        var labelEl = document.createElement("span");
        labelEl.className = "ce-label";
        labelEl.textContent = nodesData[i].label;
        nodeEl.appendChild(labelEl);

        container.appendChild(nodeEl);

        if (i < nodesData.length - 1) {
          var arrowEl = document.createElement("div");
          arrowEl.className = "ce-arrow";
          arrowEl.setAttribute("data-anim-role", "accent-line");
          arrowEl.innerHTML = '<svg width="48" height="24" viewBox="0 0 48 24" fill="none">'
            + '<line x1="0" y1="12" x2="36" y2="12" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>'
            + '<polygon points="36,4 48,12 36,20" fill="var(--accent)"/></svg>';
          container.appendChild(arrowEl);
        }
      }
    }
  }

  var title = $("title");
  if (title.length) {
    tl.from(title, { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.2);
    title[0].removeAttribute("data-anim-role");
  }

  var eyebrow = $("eyebrow");
  if (eyebrow.length) {
    tl.from(eyebrow, { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" }, 0.1);
    eyebrow[0].removeAttribute("data-anim-role");
  }

  var nodes = root.querySelectorAll(".ce-node");
  var arrows = root.querySelectorAll(".ce-arrow");

  var baseTime = 1.0;
  var interval = 1.0;

  for (var n = 0; n < nodes.length; n++) {
    var node = nodes[n];
    var emoji = node.querySelector(".ce-emoji");
    var label = node.querySelector(".ce-label");
    var t = baseTime + n * interval;

    tl.to(node, { opacity: 1, duration: 0.4, ease: "power2.out" }, t);
    if (emoji) tl.from(emoji, { scale: 0.5, duration: 0.4, ease: "back.out(1.7)" }, t);
    if (label) tl.from(label, { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.15);

    if (n < arrows.length) {
      tl.to(arrows[n], { opacity: 1, duration: 0.3, ease: "power2.out" }, t + 0.3);
      tl.from(arrows[n], { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power2.out" }, t + 0.3);
    }
  }

  if (nodes.length > 0) {
    var lastNode = nodes[nodes.length - 1];
    var endT = baseTime + (nodes.length - 1) * interval + 0.6;
    tl.to(lastNode, { scale: 1.05, duration: 0.3, ease: "power2.inOut" }, endT);
    tl.to(lastNode, { scale: 1.0, duration: 0.3, ease: "power2.out" }, endT + 0.3);
  }

  root.querySelectorAll("[data-anim-role]").forEach(function (el) {
    el.removeAttribute("data-anim-role");
  });
};
</script>
