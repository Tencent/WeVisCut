<style data-hf="structure-css">
[data-hf="structure-dom"] {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 52px 80px 48px;
  gap: 24px;
  box-sizing: border-box;
}

[data-hf="structure-dom"] .vf-title {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 60px;
  line-height: 1.2;
  color: var(--ink-1);
  max-width: 1000px;
  text-align: center;
  align-self: center;
}

[data-hf="structure-dom"] .vf-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  min-height: 0;
}

[data-hf="structure-dom"] .vf-node {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 16px 34px 16px 18px;
  min-width: 360px;
  max-width: 680px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 2px solid var(--line-strong);
  box-shadow: var(--shadow-soft);
  flex-shrink: 0;
}

[data-hf="structure-dom"] .vf-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  border: 2px solid var(--accent);
  color: var(--accent);
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

[data-hf="structure-dom"] .vf-node-label {
  font-family: var(--font-body);
  font-weight: var(--weight-display);
  font-size: 28px;
  line-height: 1.25;
  color: var(--ink-1);
}

[data-hf="structure-dom"] .vf-edge {
  width: 4px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 2px;
  background: var(--line-strong);
  transform-origin: top center;
}
</style>

<div data-hf="structure-dom">
  <h2 class="vf-title" data-anim-role="title" data-slot="headline">数据到模型的四个阶段</h2>

  <div class="vf-area">
    <div class="vf-node" data-anim-role="node">
      <span class="vf-marker" data-anim-role="marker">1</span>
      <span class="vf-node-label" data-anim-role="node-label">采集原始数据</span>
    </div>
    <div class="vf-edge" data-anim-role="edge"></div>
    <div class="vf-node" data-anim-role="node">
      <span class="vf-marker" data-anim-role="marker">2</span>
      <span class="vf-node-label" data-anim-role="node-label">清洗与标注</span>
    </div>
    <div class="vf-edge" data-anim-role="edge"></div>
    <div class="vf-node" data-anim-role="node">
      <span class="vf-marker" data-anim-role="marker">3</span>
      <span class="vf-node-label" data-anim-role="node-label">模型训练</span>
    </div>
    <div class="vf-edge" data-anim-role="edge"></div>
    <div class="vf-node" data-anim-role="node">
      <span class="vf-marker" data-anim-role="marker">4</span>
      <span class="vf-node-label" data-anim-role="node-label">评估上线</span>
    </div>
  </div>
</div>

<script data-hf="structure-script">
window.__hf_structure_init = function (tl, ctx) {
  var gsap = ctx.gsap, root = ctx.root;
  var $ = function (role) { return root.querySelectorAll('[data-anim-role="' + role + '"]'); };

  var V = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  var raw = V.nodes || null;
  var nodes = null;
  try { nodes = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { nodes = null; }

  var area = root.querySelector(".vf-area");
  if (nodes && Array.isArray(nodes) && nodes.length > 0 && area) {
    area.innerHTML = "";
    for (var i = 0; i < nodes.length; i++) {
      if (i > 0) {
        var edge = document.createElement("div");
        edge.className = "vf-edge";
        edge.setAttribute("data-anim-role", "edge");
        area.appendChild(edge);
      }
      var node = document.createElement("div");
      node.className = "vf-node";
      node.setAttribute("data-anim-role", "node");
      var marker = document.createElement("span");
      marker.className = "vf-marker";
      marker.setAttribute("data-anim-role", "marker");
      marker.textContent = String(i + 1);
      var label = document.createElement("span");
      label.className = "vf-node-label";
      label.setAttribute("data-anim-role", "node-label");
      label.textContent = nodes[i].label != null ? nodes[i].label : "";
      node.appendChild(marker);
      node.appendChild(label);
      area.appendChild(node);
    }
  }

  var allNodes = $("node"), allEdges = $("edge"), allLabels = $("node-label"), allMarkers = $("marker");
  for (var n = 0; n < allNodes.length; n++) {
    var t = 0.15 + n * 0.5;
    if (n > 0 && (n - 1) < allEdges.length) {
      tl.from(allEdges[n - 1], { scaleY: 0, opacity: 0, duration: 0.32, ease: "power2.out", transformOrigin: "top center" }, t - 0.18);
    }
    tl.from(allNodes[n], { y: -20, scale: 0.9, opacity: 0, duration: 0.5, ease: "power3.out" }, t);
    if (n < allMarkers.length) {
      tl.from(allMarkers[n], { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(1.6)" }, t + 0.08);
    }
    if (n < allLabels.length) {
      tl.from(allLabels[n], { opacity: 0, x: 12, duration: 0.32, ease: "power2.out" }, t + 0.12);
    }
  }

  function strip(role) { var els = $(role); for (var k = 0; k < els.length; k++) els[k].removeAttribute("data-anim-role"); }
  strip("node"); strip("edge"); strip("node-label"); strip("marker");
};
</script>
