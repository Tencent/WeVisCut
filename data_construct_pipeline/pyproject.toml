[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longvideo-polar"
version = "0.1.0"
description = "WeDirector data-construct pipeline: long-horizon 口播稿→成片 trajectory capture, split into orchestrator / generator / critic streams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed on the Polar control plane (harness + evaluator).
polar = ["polar>=0.1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
longvideo-polar = "longvideo_polar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["longvideo_polar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
